/* ---------- DOM helper (aman dari XSS: tidak memakai innerHTML) ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function mount(root, node) { root.replaceChildren(node); }

/* ---- Tombol kembali Android: menutup lapisan teratas (sheet, penampil, penyunting) sebelum keluar aplikasi ---- */
const bk = { stack: [], hist: 0, pending: false, armed: false };
function backSync() {
  if (bk.pending) return;
  while (bk.hist < bk.stack.length) { history.pushState({ sela: "o" }, ""); bk.hist++; }
  if (bk.hist > bk.stack.length) { bk.pending = true; history.back(); }
}
function backPush(closeFn) {
  const e = { closeFn }; bk.stack.push(e); backSync();
  return () => { const i = bk.stack.indexOf(e); if (i >= 0) { bk.stack.splice(i, 1); backSync(); } };
}
try { history.replaceState({ sela: "base" }, ""); history.pushState({ sela: "root" }, ""); } catch {}
window.addEventListener("popstate", () => {
  if (bk.pending) { bk.pending = false; bk.hist = Math.max(0, bk.hist - 1); backSync(); return; }
  if (bk.hist > 0) { bk.hist--; const e = bk.stack.pop(); try { e?.closeFn(); } catch {} backSync(); return; }
  // Di layar utama: cegah keluar tak sengaja.
  if (document.querySelector(".call")) { toast("Akhiri panggilan dulu dengan tombol Akhiri."); history.pushState({ sela: "root" }, ""); return; }
  if (bk.armed) { bk.armed = false; history.back(); return; }
  bk.armed = true; toast("Tekan kembali sekali lagi untuk keluar"); history.pushState({ sela: "root" }, ""); setTimeout(() => { bk.armed = false; }, 2200);
});

function maskPhone(p) {
  if (!p) return "-";
  if (p.includes("@")) { const [a, d] = p.split("@"); return a.slice(0, 2) + "•••@" + d; }

}

/* ---------- Login nomor telepon + OTP (dipakai aplikasi anggota dan admin) ---------- */
function loginView(title = "Sela Group Chat", subtitle = "Masuk dengan nomor telepon") {
  let confirmation = null, verifier = null, cdTimer = null;
  const err = h("div", { class: "error", role: "alert" });
  const rcHost = h("div");
  const phone = h("input", { class: "input", type: "tel", inputmode: "tel", autocomplete: "tel", placeholder: "+6281234567890", value: "+62" });
  const otp = h("input", { class: "input otp", type: "text", inputmode: "numeric", maxlength: "6", autocomplete: "one-time-code", placeholder: "••••••" });
  const sendBtn = h("button", { class: "btn primary", onclick: send }, "Kirim OTP");
  const verBtn = h("button", { class: "btn primary", onclick: verify }, "Verifikasi");
  const resend = h("button", { class: "btn ghost", onclick: send, disabled: true }, "Kirim ulang OTP");
  const otpBox = h("div", { class: "stack hidden" }, h("label", {}, "Kode OTP (6 digit)"), otp, verBtn, resend);

  function busy(btn, on, text) {
    btn.disabled = on;
    if (on) { btn.dataset.t = btn.textContent; btn.textContent = text; } else if (btn.dataset.t) btn.textContent = btn.dataset.t;
  }
  function countdown() {
    let s = 60; resend.disabled = true; clearInterval(cdTimer);
    cdTimer = setInterval(() => {
      s--; resend.textContent = s > 0 ? `Kirim ulang OTP (${s}s)` : "Kirim ulang OTP";
      if (s <= 0) { clearInterval(cdTimer); resend.disabled = false; }
    }, 1000);
  }
  async function send() {
    err.textContent = "";
    const p = phone.value.replace(/[\s-]/g, "");
    if (!/^\+[1-9]\d{7,14}$/.test(p)) { err.textContent = "Gunakan kode negara, contoh +6281234567890."; return; }
    busy(sendBtn, true, "Mengirim…");
    try {
      try { verifier?.clear(); } catch {}
      const holder = h("div"); rcHost.replaceChildren(holder);
      verifier = new RecaptchaVerifier(auth, holder, { size: "invisible" });
      confirmation = await signInWithPhoneNumber(auth, p, verifier);
      otpBox.classList.remove("hidden"); otp.focus(); countdown();
    } catch (e) { err.textContent = friendlyError(e); confirmation = null; }
    finally { busy(sendBtn, false); }
  }
  async function verify() {
    err.textContent = "";
    if (!confirmation) { err.textContent = "Kirim OTP terlebih dahulu."; return; }
    if (!/^\d{6}$/.test(otp.value.trim())) { err.textContent = "Masukkan 6 digit kode OTP."; return; }
    busy(verBtn, true, "Memverifikasi…");
    try { await confirmation.confirm(otp.value.trim()); }
    catch (e) { err.textContent = friendlyError(e); busy(verBtn, false); }
  }
  return h("div", { class: "screen center" }, h("div", { class: "card stack login" },
    h("div", { class: "logo" }, "S"), h("h1", {}, title), h("p", { class: "muted" }, subtitle),
    h("label", {}, "Nomor telepon (dengan kode negara)"), phone, sendBtn, otpBox, err, rcHost,
    h("button", { class: "btn ghost small", onclick: toggleTheme }, "🌓 Mode gelap/terang")));
}

/* ---------- Tanpa Firebase Storage: file kecil disimpan sebagai data URL di Firestore ---------- */
function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Gagal membaca file."));
    r.readAsDataURL(blob);
  });
}
async function compressImage(file, maxDim = 800, q = 0.6, maxChars = 220000) {
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) throw new Error("Foto tidak dapat dibaca.");
  const sc = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  for (let qq = q; qq >= 0.29; qq -= 0.1) { const d = c.toDataURL("image/jpeg", qq); if (d.length <= maxChars) return d; }
  throw new Error("Foto terlalu besar setelah dikompres.");
}

/* ---- storj.js ---- */


/*
 * Penyimpanan foto/video di Storj (S3). Penandatanganan SigV4 dilakukan di browser.
 *  - uploadMedia: memakai kunci TULIS (hanya Write ke bucket sela-media).
 *  - loadMedia  : memakai kunci BACA (hanya Read). Nama file acak panjang dan tidak bisa didaftar.
 *  - deleteMedia: memakai kunci ADMIN yang ditempel sendiri oleh admin (tidak ada di kode).
 */
const sjEnc = new TextEncoder();
const sjHex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
const sjSha = async (d) => sjHex(await crypto.subtle.digest("SHA-256", d instanceof ArrayBuffer ? d : sjEnc.encode(d)));
async function sjHmac(key, msg) {
  const k = await crypto.subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", k, sjEnc.encode(msg)));
}
async function sjFetch(method, key, creds, body, contentType) {
  const host = new URL(STORJ.endpoint).host;
  const amz = new Date().toISOString().replace(/[:-]|\.\d{3}/g, "");
  const date = amz.slice(0, 8);
  const buf = body ? await body.arrayBuffer() : null;
  const payload = await sjSha(buf || "");
  const path = "/" + STORJ.bucket + "/" + key;
  const hd = { "x-amz-content-sha256": payload, "x-amz-date": amz };
  let canonH = "", names = [];
  if (contentType) { hd["Content-Type"] = contentType; canonH += `content-type:${contentType}\n`; names.push("content-type"); }
  canonH += `host:${host}\nx-amz-content-sha256:${payload}\nx-amz-date:${amz}\n`; names.push("host", "x-amz-content-sha256", "x-amz-date");
  const canon = [method, path, "", canonH, names.join(";"), payload].join("\n");
  const scope = `${date}/${STORJ.region}/s3/aws4_request`;
  const sts = ["AWS4-HMAC-SHA256", amz, scope, await sjSha(canon)].join("\n");
  let k = await sjHmac(sjEnc.encode("AWS4" + creds.sk), date);
  k = await sjHmac(k, STORJ.region); k = await sjHmac(k, "s3"); k = await sjHmac(k, "aws4_request");
  hd.Authorization = `AWS4-HMAC-SHA256 Credential=${creds.ak}/${scope}, SignedHeaders=${names.join(";")}, Signature=${sjHex(await sjHmac(k, sts))}`;
  return fetch(STORJ.endpoint + path, { method, headers: hd, body: buf || undefined });
}

const SJ_EXT = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "video/webm": "webm", "video/mp4": "mp4", "video/quicktime": "mov" };
async function uploadMedia(blob, mime) {
  const mt = (mime || blob.type || "application/octet-stream").split(";")[0];
  const ext = SJ_EXT[mt] || "bin";
  const rnd = crypto.getRandomValues(new Uint8Array(12));
  const key = "m/" + sjHex(rnd) + "." + ext;
  const r = await sjFetch("PUT", key, STORJ.write, blob, mt);
  if (!r.ok) throw new Error("Unggah ke penyimpanan gagal (" + r.status + ").");
  return { key, mime: mt, size: blob.size };
}

const sjCache = new Map();
function loadMedia(key, mime) {
  if (!sjCache.has(key)) {
    sjCache.set(key, (async () => {
      const r = await sjFetch("GET", key, STORJ.read);
      if (!r.ok) throw new Error("Gagal memuat media (" + r.status + ").");
      const b = await r.blob();
      return URL.createObjectURL(mime ? new Blob([b], { type: mime }) : b);
    })().catch((e) => { sjCache.delete(key); throw e; }));
  }
  return sjCache.get(key);
}

function sjAdminKey() {
  try { const s = JSON.parse(localStorage.getItem("sela-storj-admin") || "null"); if (s?.ak && s?.sk) return s; } catch {}
  const ak = (prompt("Tempel Access Key ADMIN Storj (hanya admin, tersimpan di HP ini):") || "").trim();
  const sk = ak ? (prompt("Tempel Secret Key ADMIN Storj:") || "").trim() : "";
  if (!ak || !sk) return null;
  try { localStorage.setItem("sela-storj-admin", JSON.stringify({ ak, sk })); } catch {}
  return { ak, sk };
}
function forgetAdminKey() { try { localStorage.removeItem("sela-storj-admin"); } catch {} }
async function deleteMedia(key) {
  const c = sjAdminKey(); if (!c) throw new Error("Kunci admin Storj belum diisi.");
  const r = await sjFetch("DELETE", key, c);
  if (!r.ok && r.status !== 404) { if (r.status === 403) forgetAdminKey(); throw new Error("Hapus file gagal (" + r.status + ")."); }
}

// Elemen tampilan media untuk satu pesan (data lama di Firestore maupun file di Storj).
// Foto dan video langsung tampil (dimuat saat mendekati layar). Elemen di-cache supaya video tidak berhenti saat daftar pesan digambar ulang.
const sjEls = new Map();
function sjLazy(el, fn) {
  if (!("IntersectionObserver" in window)) { fn(); return; }
  const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { io.disconnect(); fn(); } }, { rootMargin: "400px" });
  io.observe(el);
}
function mediaEl(m, o = {}) {
  const open = o.onOpen;
  if (m.imageData) return h("img", { src: m.imageData, loading: "lazy", alt: "Foto", onclick: open });
  if (m.videoData) return h("video", { src: m.videoData, controls: !o.tile, muted: !!o.tile, preload: "metadata", playsinline: true, onclick: o.tile ? open : null });
  if (!m.mediaKey) return null;
  const ck = o.auto ? null : m.mediaKey + (o.tile ? "|t" : "|f");
  if (ck && sjEls.has(ck)) return sjEls.get(ck);
  const el = sjBuild(m, o, ck);
  if (el) sjLock(el);
  if (ck && el) sjEls.set(ck, el);
  return el;
}
// Mempersulit simpan lewat browser (tekan lama, seret, menu unduh). Ini bukan pemblokir screenshot.
function sjLock(el) {
  const apply = (n) => { if (!(n instanceof Element)) return; n.setAttribute("draggable", "false"); n.addEventListener("contextmenu", (e) => e.preventDefault()); if (n.tagName === "VIDEO") { n.setAttribute("controlsList", "nodownload noremoteplayback"); n.setAttribute("disablePictureInPicture", ""); } };
  apply(el);
  new MutationObserver((ms) => ms.forEach((mu) => mu.addedNodes.forEach((n) => { apply(n); n.querySelectorAll?.("img,video").forEach(apply); }))).observe(el, { childList: true });
}
function sjBuild(m, o, ck) {
  const open = o.onOpen;
  const isVid = m.messageType === "video" || String(m.mime || "").startsWith("video/");
  if (!isVid) {
    const im = h("img", { alt: "Foto", onclick: open });
    loadMedia(m.mediaKey, m.mime).then((u) => { im.src = u; }).catch(() => { if (ck) sjEls.delete(ck); im.replaceWith(h("div", { class: "muted small" }, "⚠ Foto gagal dimuat")); });
    return im;
  }
  const mb = m.size ? " (" + (m.size / 1048576).toFixed(1) + " MB)" : "";
  if (o.tile) {
    const t = h("div", { class: "vtile", onclick: open }, h("span", { class: "vplay" }, "▶"));
    sjLazy(t, async () => {
      try { const u = await loadMedia(m.mediaKey, m.mime); const v = h("video", { src: u, muted: true, preload: "metadata", playsinline: true }); v.muted = true; v.addEventListener("loadedmetadata", () => { try { v.currentTime = 0.1; } catch {} }); t.prepend(v); }
      catch { t.append(h("span", { class: "muted small" }, "⚠")); }
    });
    return t;
  }
  const holder = h("div", { class: "vwrap" }, h("div", { class: "muted small" }, "Memuat video" + mb + "…"));
  const load = async () => {
    holder.replaceChildren(h("div", { class: "muted small" }, "Memuat video" + mb + "…"));
    try {
      const u = await loadMedia(m.mediaKey, m.mime);
      const v = h("video", { src: u, controls: true, playsinline: true, preload: "metadata", style: "width:100%;border-radius:12px;max-height:340px;background:#000" });
      if (o.auto) v.autoplay = true; else v.addEventListener("loadedmetadata", () => { try { v.currentTime = 0.1; } catch {} }, { once: true });
      holder.replaceChildren(v);
    } catch { holder.replaceChildren(h("button", { class: "btn ghost small", onclick: load }, "⚠ Gagal memuat. Coba lagi")); }
  };
  if (o.auto) load(); else sjLazy(holder, load);
  return holder;
}

// ---- Simpan / lihat media ----
async function mediaURL(m) {
  if (m.imageData) return m.imageData;
  if (m.videoData) return m.videoData;
  if (m.mediaKey) return loadMedia(m.mediaKey, m.mime);
  throw new Error("Tidak ada media.");
}
function extOf(m, blob) {
  const t = String(m.mime || blob?.type || "");
  if (t.includes("png")) return "png"; if (t.includes("webp")) return "webp";
  if (t.startsWith("video/")) return t.includes("mp4") ? "mp4" : "webm";
  return "jpg";
}
async function saveMedia(m) {
  const u = await mediaURL(m);
  const blob = await (await fetch(u)).blob();
  const name = "sela-" + Date.now() + "." + extOf(m, blob);
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return name;
}
// Penampil layar penuh (seperti WhatsApp): tombol tutup, simpan, dan konten tambahan opsional.
function openViewer(m, o = {}) {
  const note = h("div", { class: "vw-note" });
  let rel = () => {};
  const close = () => { try { stage.querySelector("video")?.pause(); } catch {} ov.remove(); document.removeEventListener("keydown", onKey); rel(); };
  const onKey = (e) => { if (e.key === "Escape") close(); };

const edClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const edFmt = (s) => { s = Math.max(0, s); const m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(1).padStart(4, "0"); };

// Kotak crop yang bisa digeser dan ditarik sudutnya, di atas elemen "stage" berukuran tepat sama dengan media.
function edCropWidget(stage) {
  const handles = ["tl", "tr", "bl", "br"].map((k) => h("div", { class: "crop-h " + k, "data-h": k }));
  const box = h("div", { class: "crop-box" }, ...handles);
  stage.append(box);
  let W = 1, H = 1, ratio = 0, rect = { x: 0, y: 0, w: 1, h: 1 }, drag = null;
  const paint = () => { box.style.left = rect.x + "px"; box.style.top = rect.y + "px"; box.style.width = rect.w + "px"; box.style.height = rect.h + "px"; };
  const full = () => { rect = { x: 0, y: 0, w: W, h: H }; };
  const fit = () => {
    if (!ratio) { full(); return; }
    let w = W, hh = W / ratio; if (hh > H) { hh = H; w = H * ratio; }
    rect = { x: (W - w) / 2, y: (H - hh) / 2, w, h: hh };
  };
  const api = {
    layout() { W = stage.clientWidth || 1; H = stage.clientHeight || 1; fit(); paint(); },
    setAspect(r) { ratio = r || 0; fit(); paint(); },
    reset() { ratio = 0; full(); paint(); },
    get() { return { x: rect.x / W, y: rect.y / H, w: rect.w / W, h: rect.h / H }; },
    isFull() { return rect.w >= W - 1 && rect.h >= H - 1; },
  };
  const pos = (e) => { const b = stage.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  box.addEventListener("pointerdown", (e) => {
    e.preventDefault(); const p = pos(e); const hk = e.target.dataset?.h || null;
    try { box.setPointerCapture(e.pointerId); } catch {}
    if (hk) {
      const ax = hk.includes("l") ? rect.x + rect.w : rect.x, ay = hk.includes("t") ? rect.y + rect.h : rect.y;
      drag = { mode: "size", ax, ay };
    } else drag = { mode: "move", px: p.x, py: p.y, r0: { ...rect } };
  });
  box.addEventListener("pointermove", (e) => {
    if (!drag) return; const p = pos(e);
    if (drag.mode === "move") {
      rect.x = edClamp(drag.r0.x + p.x - drag.px, 0, W - rect.w); rect.y = edClamp(drag.r0.y + p.y - drag.py, 0, H - rect.h); paint(); return;
    }
    const { ax, ay } = drag; const px = edClamp(p.x, 0, W), py = edClamp(p.y, 0, H);
    const sx = px >= ax ? 1 : -1, sy = py >= ay ? 1 : -1;
    let w = Math.abs(px - ax), hh = Math.abs(py - ay);
    if (ratio) {
      hh = w / ratio;
      const maxH = sy > 0 ? H - ay : ay; if (hh > maxH) { hh = maxH; w = hh * ratio; }
      const maxW = sx > 0 ? W - ax : ax; if (w > maxW) { w = maxW; hh = w / ratio; }
    }
    const minS = 48; if (w < minS) { w = minS; if (ratio) hh = w / ratio; } if (hh < minS) { hh = minS; if (ratio) w = hh * ratio; }
    rect = { x: sx > 0 ? ax : ax - w, y: sy > 0 ? ay : ay - hh, w, h: hh };
    rect.x = edClamp(rect.x, 0, W - rect.w); rect.y = edClamp(rect.y, 0, H - rect.h); paint();
  });
  const up = () => { drag = null; };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
  return api;
}

// Menghitung ukuran tampil media agar muat di area.

/* ---------- VIDEO: pangkas, bisukan, crop. Mengembalikan {start,end,mute,crop,changed} atau null. ---------- */
async function editVideo(file, MAX = 90) {

  let start = 0, end = dur ? Math.min(dur, MAX) : 0, mute = false, hd = false;
  return new Promise((resolve) => {
    const { ov, area, tools, cancel, done, rel } = edShell("Sunting video", "Lanjut ➜");

    const sE = h("input", { type: "range", min: "0", max: String(dur || 1), step: "0.1", value: String(end) });
    const paintInfo = () => { info.textContent = dur ? `Potong: ${edFmt(start)} → ${edFmt(end)}  ·  durasi ${(end - start).toFixed(1)} dtk` : "Durasi video tidak terbaca, tidak bisa dipangkas."; };
    const playBtn = h("button", { class: "ed-chip", onclick: () => { if (v.paused) { if (v.currentTime < start || v.currentTime >= end - 0.05) v.currentTime = start; v.play().catch(() => {}); } else v.pause(); } }, "▶ Putar");
    v.addEventListener("play", () => { playBtn.textContent = "⏸ Jeda"; }); v.addEventListener("pause", () => { playBtn.textContent = "▶ Putar"; });
    v.addEventListener("timeupdate", () => { if (dur && v.currentTime >= end) { v.pause(); v.currentTime = start; } });
    const muteBtn = h("button", { class: "ed-chip", onclick: () => { mute = !mute; v.muted = mute; muteBtn.textContent = mute ? "🔇 Audio mati" : "🔊 Audio nyala"; muteBtn.classList.toggle("on", mute); } }, "🔊 Audio nyala");
    const hdBtn = h("button", { class: "ed-chip", onclick: () => { hd = !hd; hdBtn.classList.toggle("on", hd); hdBtn.textContent = hd ? "✓ Kirim HD" : "Kirim HD"; } }, "Kirim HD");
    if (dur) {
      sS.oninput = () => { start = Number(sS.value); if (start > end - 0.5) { start = Math.max(0, end - 0.5); sS.value = String(start); } if (end - start > MAX) { end = start + MAX; sE.value = String(end); } v.pause(); v.currentTime = start; paintInfo(); };
      sE.oninput = () => { end = Number(sE.value); if (end < start + 0.5) { end = Math.min(dur, start + 0.5); sE.value = String(end); } if (end - start > MAX) { start = end - MAX; sS.value = String(start); } v.pause(); v.currentTime = Math.max(start, end - 0.1); paintInfo(); };
    } else { sS.disabled = true; sE.disabled = true; }
    paintInfo();
    tools.append(
      h("div", { class: "ed-trim" }, h("label", {}, "Mulai"), sS, h("label", {}, "Selesai"), sE), info,
      h("div", { class: "ed-chips" }, playBtn, muteBtn, hdBtn), chips,
      h("p", { class: "muted small", style: "text-align:center" }, `Maks. ${MAX} detik. Geser kotak atau tarik sudutnya untuk crop.`));
    const end2 = (val) => { window.removeEventListener("resize", layout); try { v.pause(); } catch {} ov.remove(); rel(); URL.revokeObjectURL(url); resolve(val); };
    cancel.onclick = () => end2(null);

      const c = crop.get();
      end2({ start, end: dur ? end : 0, mute, hd, crop: c, changed: mute || !crop.isFull() || (dur ? start > 0.05 || end < dur - 0.05 : false) });

/* Proses video sesuai hasil editVideo (pangkas + crop + bisu). Mengembalikan Blob, atau null jika dibatalkan. */
async function processVideo(file, o, setProg, cancelled) {
  const url = URL.createObjectURL(file);
  const v = document.createElement("video"); v.src = url; v.playsInline = true; v.preload = "auto"; v.muted = !!o.mute;
  let ctx, timer, rec;
  const cleanup = () => { clearInterval(timer); try { ctx?.close(); } catch {} try { v.pause(); } catch {} URL.revokeObjectURL(url); };
  try {
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("Video tidak dapat dibaca di browser ini.")); });
    const total = isFinite(v.duration) ? v.duration : 90;
    const start = o.start || 0, end = Math.min(o.end || total, start + 90, total);
    const cr = o.crop || { x: 0, y: 0, w: 1, h: 1 };
    const sx = Math.round(cr.x * v.videoWidth), sy = Math.round(cr.y * v.videoHeight);
    const sw = Math.max(2, Math.round(cr.w * v.videoWidth)), sh = Math.max(2, Math.round(cr.h * v.videoHeight));
    const HD = !!o.hd; const k = Math.min(1, (HD ? 1280 : 480) / Math.max(sw, sh));
    const c = document.createElement("canvas"); c.width = Math.max(2, Math.round(sw * k / 2) * 2); c.height = Math.max(2, Math.round(sh * k / 2) * 2);
    const g = c.getContext("2d");
    if (start > 0) { await new Promise((res) => { v.onseeked = res; v.currentTime = start; }); }
    g.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
    const out = c.captureStream(HD ? 30 : 15);
    if (!o.mute) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume(); const dest = ctx.createMediaStreamDestination(); ctx.createMediaElementSource(v).connect(dest); dest.stream.getAudioTracks().forEach((t) => out.addTrack(t)); } catch {}
    }
    const mime = ["video/webm;codecs=vp8,opus", "video/webm", "video/mp4"].find((t) => MediaRecorder.isTypeSupported(t));
    rec = new MediaRecorder(out, { mimeType: mime, videoBitsPerSecond: HD ? 2500000 : 300000, audioBitsPerSecond: HD ? 96000 : 32000 });
    const chunks = []; rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const done = new Promise((res) => (rec.onstop = res));
    rec.start(); await v.play();
    timer = setInterval(() => {
      g.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
      setProg?.(Math.min(100, Math.round(((v.currentTime - start) / Math.max(0.1, end - start)) * 100)));
      if (cancelled?.() || v.currentTime >= end || v.ended) { clearInterval(timer); try { rec.state === "recording" && rec.stop(); } catch {} }
    }, HD ? 33 : 66);
    await done; cleanup();
    if (cancelled?.()) return null;
    return new Blob(chunks, { type: rec.mimeType || "video/webm" });
  } catch (e) { cleanup(); throw e; }
}

/*
 * Panggilan video 1-lawan-1 dengan WebRTC. Signaling lewat Firestore:
 *   calls/{id}  -> offer, answer, status (ringing|accepted|rejected|ended|missed)
 *   calls/{id}/callerCandidates, calls/{id}/receiverCandidates -> ICE candidates
 * Tanpa server TURN, panggilan bisa gagal pada sebagian jaringan seluler/NAT ketat.
 */
class CallManager {
  constructor({ db, uid, groupId, nameOf, root }) {
    Object.assign(this, { db, uid, groupId, nameOf, root });
    this.pc = null; this.local = null; this.ui = null; this.unsubs = []; this.callId = null;
    this.facing = "user"; this.ended = false; this.video = true; this.ringTimer = null; this.discTimer = null;
  }

  listenIncoming() {
    const q = query(collection(this.db, "calls"), where("receiverUid", "==", this.uid), where("status", "==", "ringing"));
    const un = onSnapshot(q, (snap) => {
      snap.docChanges().forEach((c) => {
        if (c.type !== "added") return;
        const d = c.doc.data();
        const created = d.createdAt?.toMillis?.() ?? Date.now();
        if (Date.now() - created > 60000) return; // panggilan lama diabaikan
        if (this.callId) { updateDoc(c.doc.ref, { status: "rejected", endedAt: serverTimestamp() }).catch(() => {}); return; } // sedang sibuk
        this.showIncoming(c.doc.id, d);
      });
    }, () => {});
    this.unsubs.push(un);
    return un;
  }

  destroy() { this.cleanup(); this.unsubs.forEach((f) => { try { f(); } catch {} }); this.unsubs = []; }

  /* ---------- UI ---------- */
  buildUI(title, withVideo) {
    this.closeUI();
    const remote = h("video", { class: "remote", autoplay: true, playsinline: true });
    const local = h("video", { class: "local", autoplay: true, playsinline: true, muted: true });
    local.muted = true;
    const status = h("div", {}, "Menghubungkan…");
    const banner = h("div", { class: "banner hidden" });
    const chip = h("div", { class: "obs-chip hidden" }, ".");
    const ctrls = h("div", { class: "ctrls" });
    const el = h("div", { class: "call" }, remote, withVideo ? local : null, h("div", { class: "top" }, h("b", {}, title), status, banner, chip), ctrls);
    this.root.append(el);
    this.ui = { el, remote, local, status, ctrls, banner, chip };
    return this.ui;
  }
  paintMirror() { if (this.ui?.local) applyMirror(this.ui.local, this.facing); }
  closeUI() { this.ui?.el.remove(); this.ui = null; }
  setChip(on) { const c = this.ui?.chip; if (c) c.classList.toggle("hidden", !on); }
  setBanner(t, ms) {
    const b = this.ui?.banner; if (!b) return;
    b.textContent = t || ""; b.classList.toggle("hidden", !t);
    if (ms) setTimeout(() => { if (b.textContent === t) { b.textContent = ""; b.classList.add("hidden"); } }, ms);
  }
  setStatus(t) { if (this.ui) this.ui.status.textContent = t; }

  controls(withVideo) {
    const { ctrls } = this.ui;
    const mic = h("button", { class: "cbtn", "aria-label": "Mikrofon" }, "🎤");
    const cam = h("button", { class: "cbtn", "aria-label": "Kamera" }, "📷");
    const flip = h("button", { class: "cbtn", "aria-label": "Balik kamera" }, "🔄");
    const end = h("button", { class: "cbtn end", "aria-label": "Akhiri" }, "📵");
    mic.onclick = () => { const t = this.local?.getAudioTracks()[0]; if (!t) return; t.enabled = !t.enabled; mic.classList.toggle("off", !t.enabled); mic.textContent = t.enabled ? "🎤" : "🔇"; };
    cam.onclick = () => { const t = this.local?.getVideoTracks()[0]; if (!t) return; t.enabled = !t.enabled; cam.classList.toggle("off", !t.enabled); };
    const mir = h("button", { class: "cbtn", "aria-label": "Cermin" }, "🪞");
    mir.onclick = () => { setMirror(!mirrorOn()); this.paintMirror(); };
    flip.onclick = () => this.flipCamera();
    end.onclick = () => this.hangup();
    ctrls.replaceChildren(mic, ...(withVideo ? [cam, flip, mir] : []), end);
  }

  async flipCamera() {
    if (!this.local || !this.pc) return;
    try {
      const next = this.facing === "user" ? "environment" : "user";
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: next } } });
      const nt = s.getVideoTracks()[0];
      const sender = this.pc.getSenders().find((x) => x.track?.kind === "video");
      if (sender) await sender.replaceTrack(nt);
      this.local.getVideoTracks().forEach((t) => { t.stop(); this.local.removeTrack(t); });
      this.local.addTrack(nt); this.ui.local.srcObject = this.local; this.facing = next; this.paintMirror();
    } catch { toast("Tidak dapat beralih kamera.", "err"); }
  }

  async getMedia(video) {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("Browser tidak mendukung panggilan. Buka lewat https di Chrome.");
    try {
      return await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: this.facing } : false });
    } catch { throw new Error("Izin kamera/mikrofon ditolak. Aktifkan di pengaturan situs lalu coba lagi."); }
  }

  makePC(callId, side) {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    this.pc = pc;
    this.local.getTracks().forEach((t) => pc.addTrack(t, this.local));
    pc.ontrack = (e) => { if (this.ui) { this.ui.remote.srcObject = e.streams[0]; } };
    const mine = collection(this.db, "calls", callId, side + "Candidates");
    pc.onicecandidate = (e) => { if (e.candidate) addDoc(mine, e.candidate.toJSON()).catch(() => {}); };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === "connected") { clearTimeout(this.discTimer); this.setStatus("Panggilan berlangsung"); }
      else if (s === "connecting") this.setStatus("Menghubungkan…");
      else if (s === "disconnected") {
        this.setStatus("Koneksi tidak stabil, mencoba menyambung kembali…");
        clearTimeout(this.discTimer); this.discTimer = setTimeout(() => { if (this.pc?.connectionState !== "connected") this.fail("Koneksi terputus."); }, 12000);
      } else if (s === "failed") this.fail("Koneksi gagal. Jaringan mungkin memerlukan server TURN.");
    };
    // Dengarkan candidate dari pihak lain
    // Candidate dari pihak lain ditahan sampai remote description terpasang.
    const other = side === "caller" ? "receiver" : "caller";
    this.pending = [];
    this.unsubCall(onSnapshot(collection(this.db, "calls", callId, other + "Candidates"), (s) => {
      s.docChanges().forEach((c) => {
        if (c.type !== "added") return;
        if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(() => {});
        else this.pending.push(c.doc.data());
      });
    }, () => {}));
    this.watchObservers(callId);
    return pc;
  }
  async setRemote(desc) {
    await this.pc.setRemoteDescription(new RTCSessionDescription(desc));
    (this.pending || []).splice(0).forEach((c) => this.pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}));
  }
  /* Admin bergabung sebagai pemantau: SELALU diumumkan ke peserta lewat banner. Admin hanya menerima, tidak mengirim kamera/mikrofon. */
  watchObservers(callId) {
    this.obsPeers = {};
    this.unsubCall(onSnapshot(collection(this.db, "calls", callId, "observers"), (snap) => {
      snap.docChanges().forEach((c) => {
        const aid = c.doc.id;
        if (c.type === "added") {
          this.setBanner(".", 4000); this.setChip(true);
          this.servePeer(callId, aid);
        } else if (c.type === "removed") {
          this.closePeer(aid); this.setChip(false); this.setBanner(".", 4000);
        }
      });
    }, () => {}));
  }
  servePeer(callId, aid) {
    this.closePeer(aid);
    const pref = doc(this.db, "calls", callId, "obsPeers", this.uid);
    const cand = collection(pref, "cand");
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    const rec = { pc, unsubs: [] }; this.obsPeers[aid] = rec;
    this.local?.getTracks().forEach((t) => pc.addTrack(t, this.local));
    pc.onicecandidate = (e) => { if (e.candidate) addDoc(cand, { from: "member", ...e.candidate.toJSON() }).catch(() => {}); };
    const pending = []; let handled = null;
    rec.unsubs.push(onSnapshot(pref, async (s) => {
      const d = s.data();
      if (!d?.offer || d.answer || handled === d.offer.sdp) return;
      handled = d.offer.sdp;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
        pending.splice(0).forEach((x) => pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}));
        const a = await pc.createAnswer(); await pc.setLocalDescription(a);
        await updateDoc(pref, { answer: { type: a.type, sdp: a.sdp } });
      } catch {}
    }, () => {}));
    rec.unsubs.push(onSnapshot(cand, (s) => s.docChanges().forEach((ch) => {
      if (ch.type !== "added") return;
      const { from, ...x } = ch.doc.data(); if (from !== "admin") return;
      if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}); else pending.push(x);
    }), () => {}));
  }
  closePeer(aid) {
    const r = this.obsPeers?.[aid]; if (!r) return;
    r.unsubs.forEach((f) => { try { f(); } catch {} }); try { r.pc.close(); } catch {}
    delete this.obsPeers[aid];
  }
  unsubCall(f) { (this.callUnsubs ||= []).push(f); }

  /* ---------- Penelepon ---------- */
  async startCall(peerUid, video = true) {
    if (this.callId) return toast("Kamu sedang dalam panggilan.", "err");
    this.ended = false; this.video = video;
    const ui = this.buildUI("Memanggil " + this.nameOf(peerUid) + "…", video);
    this.controls(video);
    try {
      this.local = await this.getMedia(video); ui.local && (ui.local.srcObject = this.local); this.paintMirror();
      const ref = await addDoc(collection(this.db, "calls"), {
        callerUid: this.uid, receiverUid: peerUid, groupId: this.groupId, status: "ringing", video, createdAt: serverTimestamp(), startedAt: null, endedAt: null, answer: null, offer: null,
      });
      this.callId = ref.id;
      const pc = this.makePC(ref.id, "caller");
      const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
      await updateDocSafe(ref, { offer: { type: offer.type, sdp: offer.sdp } }, true);
      this.setStatus("Berdering…");
      this.ringTimer = setTimeout(() => { if (!this.ended && this.pc?.connectionState !== "connected") { updateDoc(ref, { status: "missed", endedAt: serverTimestamp() }).catch(() => {}); this.fail("Tidak dijawab."); } }, 45000);
      this.unsubCall(onSnapshot(ref, (s) => {
        const d = s.data(); if (!d) return;
        if (d.answer && !pc.currentRemoteDescription) { this.setRemote(d.answer).catch(() => {}); clearTimeout(this.ringTimer); this.setStatus("Menghubungkan…"); }
        if (d.status === "rejected") this.fail("Panggilan ditolak.");
        if (d.status === "ended") this.fail("Panggilan diakhiri.");
      }));
    } catch (e) { this.fail(e.message || "Gagal memulai panggilan."); }
  }

  /* ---------- Penerima ---------- */
  showIncoming(callId, d) {
    this.callId = callId; this.ended = false; this.video = !!d.video;
    const ui = this.buildUI(this.nameOf(d.callerUid), false);
    ui.remote.classList.add("hidden");
    const info = h("div", { class: "center-info" }, h("div", { class: "pulse" }, "📞"), h("h2", {}, this.nameOf(d.callerUid)), h("p", {}, d.video ? "Panggilan video masuk…" : "Panggilan suara masuk…"));
    ui.el.append(info);
    const acc = h("button", { class: "cbtn acc", "aria-label": "Terima" }, "📞"), rej = h("button", { class: "cbtn end", "aria-label": "Tolak" }, "✕");
    ui.ctrls.replaceChildren(rej, acc);
    const ref = doc(this.db, "calls", callId);
    this.unsubCall(onSnapshot(ref, (s) => { const x = s.data(); if (x && ["ended", "missed"].includes(x.status)) this.fail("Panggilan berakhir."); }));
    rej.onclick = async () => { await updateDoc(ref, { status: "rejected", endedAt: serverTimestamp() }).catch(() => {}); this.cleanup(); };
    acc.onclick = () => this.accept(callId, d, info);
  }

  async accept(callId, d, info) {
    const ref = doc(this.db, "calls", callId);
    try {
      info.remove(); this.ui.remote.classList.remove("hidden");
      if (d.video) { /* tampilkan video lokal */ const l = h("video", { class: "local", autoplay: true, playsinline: true }); l.muted = true; this.ui.el.insertBefore(l, this.ui.ctrls); this.ui.local = l; }
      this.controls(!!d.video); this.setStatus("Menghubungkan…");
      this.local = await this.getMedia(!!d.video); if (this.ui.local) this.ui.local.srcObject = this.local; this.paintMirror();
      const pc = this.makePC(callId, "receiver");
      // Offer bisa belum ada saat notifikasi pertama datang, jadi ambil data terbaru.
      let offer = d.offer;
      if (!offer) offer = (await getDoc(ref)).data()?.offer;
      if (!offer) throw new Error("Data panggilan tidak lengkap.");
      await this.setRemote(offer);
      const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
      await updateDoc(ref, { answer: { type: answer.type, sdp: answer.sdp }, status: "accepted", startedAt: serverTimestamp() });
    } catch (e) { await updateDoc(ref, { status: "ended", endedAt: serverTimestamp() }).catch(() => {}); this.fail(e.message || "Gagal menerima panggilan."); }
  }

  async hangup() {
    if (this.callId) await updateDoc(doc(this.db, "calls", this.callId), { status: "ended", endedAt: serverTimestamp() }).catch(() => {});
    this.cleanup();
  }
  fail(msg) { if (this.ended) return; toast(msg, "err"); this.cleanup(); }
  cleanup() {
    this.ended = true; clearTimeout(this.ringTimer); clearTimeout(this.discTimer);
    (this.callUnsubs || []).forEach((f) => { try { f(); } catch {} }); this.callUnsubs = [];
    Object.keys(this.obsPeers || {}).forEach((k) => this.closePeer(k));
    try { this.pc?.close(); } catch {} this.pc = null;
    this.local?.getTracks().forEach((t) => t.stop()); this.local = null;
    this.callId = null; this.closeUI();
  }
}

// updateDoc yang mengembalikan error jelas jika gagal
async function updateDocSafe(ref, data) { await updateDoc(ref, data); }

/*
 * Room panggilan grup (mesh WebRTC). 10 room, tiap room maksimal 10 peserta.
 *   rooms/{r1..r10}.members = { uid: { sid, video, ts } }   (ts diperbarui tiap 20 dtk sebagai penanda masih aktif)
 *   rooms/{rid}/sig/{pid} + /cand          signaling antar peserta (pid = penawar.sid.penjawab.sid)
 *   rooms/{rid}/observers/{adminUid}        admin bergabung sebagai pemantau (SELALU diumumkan ke peserta)
 *   rooms/{rid}/obsPeers/{uid_sid} + /cand  signaling admin <-> peserta
 * Mesh berarti tiap peserta mengirim ke semua peserta lain: pada 6+ orang matikan kamera agar lancar.
 */
const ROOM_COUNT = 10;
const ROOM_CAP = 10;
const ROOM_FRESH_MS = 75000;
const roomIds = Array.from({ length: ROOM_COUNT }, (_, i) => "r" + (i + 1));
function freshMembers(data, now = Date.now()) {
  return Object.entries(data?.members || {})
    .filter(([, v]) => (v?.ts?.toMillis ? now - v.ts.toMillis() < ROOM_FRESH_MS : true))
    .map(([uid, v]) => ({ uid, ...v }));
}

class RoomManager {
  constructor({ db, uid, nameOf, root }) {
    Object.assign(this, { db, uid, nameOf, root });
    this.rid = null; this.sid = null; this.local = null; this.ui = null; this.peers = new Map(); this.unsubs = [];
    this.obsPeers = {}; this.hb = null; this.seenSelf = false; this.facing = "user"; this.left = true;
    window.addEventListener("pagehide", () => { if (this.rid) this.leave(true); });
  }

  async join(rid, wantVideo = true) {
    if (this.rid) return toast("Kamu sedang berada di sebuah room.", "err");
    if (!navigator.mediaDevices?.getUserMedia) return toast("Browser tidak mendukung panggilan. Buka lewat https di Chrome.", "err");
    const ref = doc(this.db, "rooms", rid);
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
        video: wantVideo ? { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 15 } } : false,
      });
    } catch { return toast("Izin kamera/mikrofon ditolak. Aktifkan di pengaturan situs.", "err"); }
    const sid = Math.random().toString(36).slice(2, 10);
    let others = 0;
    try {
      await runTransaction(this.db, async (tx) => {
        const s = await tx.get(ref);
        const fresh = freshMembers(s.exists() ? s.data() : {}).filter((m) => m.uid !== this.uid);
        others = fresh.length;
        if (fresh.length >= ROOM_CAP) { const e = new Error("full"); e.full = true; throw e; }
        tx.set(ref, { members: { [this.uid]: { sid, video: !!wantVideo, ts: serverTimestamp() } } }, { merge: true });
      });
    } catch (e) {
      stream.getTracks().forEach((t) => t.stop());
      return toast(e.full ? "Room ini sudah penuh (10/10). Silakan pindah ke Room lain." :
        e.code === "permission-denied" ? "Room penuh atau berisi sesi lama. Pindah ke Room lain, atau minta admin mengosongkan room ini." :
        "Gagal masuk room: " + friendlyError(e), "err");
    }
    this.rid = rid; this.sid = sid; this.local = stream; this.left = false; this.seenSelf = false;
    // Banyak peserta: kamera dimatikan otomatis agar lancar (bisa dinyalakan lagi).
    if (others >= 5) stream.getVideoTracks().forEach((t) => (t.enabled = false));
    this.buildUI(rid);
    this.hb = setInterval(() => updateDoc(ref, { ["members." + this.uid + ".ts"]: serverTimestamp() }).catch(() => {}), 20000);
    this.unsubs.push(onSnapshot(ref, (snap) => {
      const data = snap.data() || {};
      const me = data.members?.[this.uid];
      if (me && me.sid === this.sid) this.seenSelf = true;
      else if (this.seenSelf) { toast("Kamu dikeluarkan dari room oleh admin.", "err"); this.leave(false); return; }
      this.sync(freshMembers(data));
    }, () => {}));
    this.watchObservers();
  }

  /* ---------- peserta lain ---------- */
  sync(members) {
    if (!this.rid) return;
    const others = members.filter((m) => m.uid !== this.uid);
    for (const [uid, p] of [...this.peers]) {
      const m = others.find((x) => x.uid === uid);
      if (!m || m.sid !== p.sid) this.drop(uid);
    }
    others.forEach((m) => { if (!this.peers.has(m.uid)) this.connect(m); });
    this.layout(members.length);
  }

  connect(m) {
    const offerer = this.uid < m.uid;
    const pid = (offerer ? [this.uid, this.sid, m.uid, m.sid] : [m.uid, m.sid, this.uid, this.sid]).join(".");
    const pref = doc(this.db, "rooms", this.rid, "sig", pid), cand = collection(pref, "cand");
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    const p = { pc, sid: m.sid, unsubs: [], tile: this.makeTile(m.uid) };
    this.peers.set(m.uid, p);
    this.local.getTracks().forEach((t) => pc.addTrack(t, this.local));
    pc.ontrack = (e) => { p.tile.video.srcObject = e.streams[0]; };
    pc.onicecandidate = (e) => { if (e.candidate) addDoc(cand, { from: offerer ? "o" : "a", ...e.candidate.toJSON() }).catch(() => {}); };
    pc.onconnectionstatechange = () => {
      p.tile.state.textContent = pc.connectionState === "connected" ? "" : pc.connectionState === "failed" ? "terputus" : "menyambung…";
      if (pc.connectionState === "connected") this.limitBitrate(pc);
      if (pc.connectionState === "failed") setTimeout(() => { if (this.peers.get(m.uid) === p) { this.drop(m.uid); this.layout(this.peers.size + 1); this.refreshRoster(); } }, 2000);
    };
    const pending = []; const want = offerer ? "a" : "o";
    const flush = () => pending.splice(0).forEach((x) => pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}));
    p.unsubs.push(onSnapshot(cand, (s) => s.docChanges().forEach((ch) => {
      if (ch.type !== "added") return;
      const { from, ...x } = ch.doc.data(); if (from !== want) return;
      if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}); else pending.push(x);
    }), () => {}));
    if (offerer) {
      (async () => {
        try {
          const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
          await setDoc(pref, { offer: { type: offer.type, sdp: offer.sdp }, answer: null });
        } catch {}
      })();
      p.unsubs.push(onSnapshot(pref, (s) => {
        const d = s.data();
        if (d?.answer && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(d.answer)).then(flush).catch(() => {});
      }, () => {}));
    } else {
      let handled = null;
      p.unsubs.push(onSnapshot(pref, async (s) => {
        const d = s.data();
        if (!d?.offer || d.answer || handled === d.offer.sdp) return;
        handled = d.offer.sdp;
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(d.offer)); flush();
          const a = await pc.createAnswer(); await pc.setLocalDescription(a);
          await updateDoc(pref, { answer: { type: a.type, sdp: a.sdp } });
        } catch {}
      }, () => {}));
    }
  }
  refreshRoster() { /* memicu sinkronisasi ulang lewat heartbeat sendiri */ if (this.rid) updateDoc(doc(this.db, "rooms", this.rid), { ["members." + this.uid + ".ts"]: serverTimestamp() }).catch(() => {}); }
  limitBitrate(pc) {
    try { pc.getSenders().forEach((s) => { if (s.track?.kind !== "video") return; const prm = s.getParameters(); prm.encodings = prm.encodings?.length ? prm.encodings : [{}]; prm.encodings[0].maxBitrate = 130000; s.setParameters(prm).catch(() => {}); }); } catch {}
  }
  drop(uid) {
    const p = this.peers.get(uid); if (!p) return;
    p.unsubs.forEach((f) => { try { f(); } catch {} }); try { p.pc.close(); } catch {}
    p.tile.el.remove(); this.peers.delete(uid);
  }

  /* ---------- UI ---------- */
  makeTile(uid, me = false) {
    const video = h("video", { autoplay: true, playsinline: true }); if (me) video.muted = true;
    const state = h("span", { class: "muted small" });
    const nm = me ? "Kamu" : this.nameOf(uid);
    const el = h("div", { class: "rtile " + (me ? "me" : "other") }, h("div", { class: "ph" }, (nm[0] || "?").toUpperCase()), video, h("div", { class: "nm" }, nm, " ", state));
    this.ui?.grid.append(el);
    return { el, video, state };
  }
  buildUI(rid) {
    this.closeUI();
    const grid = h("div", { class: "room-grid" });
    const title = h("b", {}, "Room " + rid.slice(1));
    const count = h("div", {}, "");
    const banner = h("div", { class: "banner hidden" });
    const chip = h("div", { class: "obs-chip hidden" }, ".");
    const ctrls = h("div", { class: "ctrls" });
    const el = h("div", { class: "call room" }, grid, h("div", { class: "top" }, title, count, banner, chip), ctrls);
    this.root.append(el);
    this.ui = { el, grid, count, banner, chip, ctrls };
    this.me = this.makeTile(this.uid, true); this.me.video.srcObject = this.local; applyMirror(this.me.video, this.facing);
    const mic = h("button", { class: "cbtn", "aria-label": "Mikrofon" }, "🎤");
    const cam = h("button", { class: "cbtn", "aria-label": "Kamera" }, "📷");
    const flip = h("button", { class: "cbtn", "aria-label": "Balik kamera" }, "🔄");
    const end = h("button", { class: "cbtn end", "aria-label": "Keluar room" }, "📵");
    const vt = () => this.local.getVideoTracks()[0];
    const paintCam = () => cam.classList.toggle("off", !!vt() && !vt().enabled);
    paintCam();
    mic.onclick = () => { const t = this.local.getAudioTracks()[0]; if (!t) return; t.enabled = !t.enabled; mic.classList.toggle("off", !t.enabled); mic.textContent = t.enabled ? "🎤" : "🔇"; };
    cam.onclick = () => { const t = vt(); if (!t) return toast("Kamu masuk tanpa kamera.", "err"); t.enabled = !t.enabled; paintCam(); };
    const mir = h("button", { class: "cbtn", "aria-label": "Cermin" }, "🪞");
    mir.onclick = () => { setMirror(!mirrorOn()); applyMirror(this.me.video, this.facing); };
    flip.onclick = () => this.flipCamera();
    end.onclick = () => this.leave(false);

    this.layout(1);
  }
  layout(n) {
    if (!this.ui) return;
    const g = this.ui.grid; const others = this.peers.size;
    g.classList.toggle("duo", others === 1);
    g.style.setProperty("--cols", String(n <= 4 ? 2 : 3));
    g.style.setProperty("--rows", String(Math.ceil(n / (n <= 4 ? 2 : 3))));
    if (others === 0) g.classList.add("solo"); else g.classList.remove("solo");
    this.ui.count.textContent = `${n}/${ROOM_CAP} peserta` + (n > 5 ? " · matikan kamera agar lancar" : "");
  }
  closeUI() { this.ui?.el.remove(); this.ui = null; }
  setChip(on) { const c = this.ui?.chip; if (c) c.classList.toggle("hidden", !on); }
  setBanner(t, ms) {
    const b = this.ui?.banner; if (!b) return;
    b.textContent = t || ""; b.classList.toggle("hidden", !t);
    if (ms) setTimeout(() => { if (b.textContent === t) { b.textContent = ""; b.classList.add("hidden"); } }, ms);
  }
  async flipCamera() {
    try {
      const next = this.facing === "user" ? "environment" : "user";
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: next }, width: { ideal: 320 }, height: { ideal: 240 } } });
      const nt = s.getVideoTracks()[0];
      const was = this.local.getVideoTracks()[0]; if (was) nt.enabled = was.enabled;
      this.peers.forEach((p) => { const sn = p.pc.getSenders().find((x) => x.track?.kind === "video"); if (sn) sn.replaceTrack(nt); });
      this.local.getVideoTracks().forEach((t) => { t.stop(); this.local.removeTrack(t); });
      this.local.addTrack(nt); this.me.video.srcObject = this.local; this.facing = next; applyMirror(this.me.video, this.facing);
    } catch { toast("Tidak dapat beralih kamera.", "err"); }
  }

  /* ---------- pemantau admin (selalu diumumkan) ---------- */
  watchObservers() {
    const rid = this.rid;
    this.unsubs.push(onSnapshot(collection(this.db, "rooms", rid, "observers"), (snap) => {
      snap.docChanges().forEach((c) => {
        if (c.type === "added") {
          this.setBanner(".", 4000); this.setChip(true);
          this.serveAdmin(c.doc.id);
        } else if (c.type === "removed") { this.closeAdmin(c.doc.id); this.setChip(false); this.setBanner(".", 4000); }
      });
    }, () => {}));
  }
  serveAdmin(aid) {
    this.closeAdmin(aid);
    const pref = doc(this.db, "rooms", this.rid, "obsPeers", this.uid + "_" + this.sid), cand = collection(pref, "cand");
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    const rec = { pc, unsubs: [] }; this.obsPeers[aid] = rec;
    this.local.getTracks().forEach((t) => pc.addTrack(t, this.local));
    pc.onicecandidate = (e) => { if (e.candidate) addDoc(cand, { from: "member", ...e.candidate.toJSON() }).catch(() => {}); };
    const pending = []; let handled = null;
    rec.unsubs.push(onSnapshot(pref, async (s) => {
      const d = s.data();
      if (!d?.offer || d.answer || handled === d.offer.sdp) return;

    }, () => {}));

    this.rid = null; this.closeUI();
    if (ref) await updateDoc(ref, { ["members." + this.uid]: deleteField() }).catch(() => {});
  }
}

/* ======================= ALUR UTAMA ======================= */
async function boot(user) {
  const uid = user.uid;
  const S = { step: null, member: undefined, req: undefined, view: null, viewCleanup: null, group: null, name: "" };
  cleanups.push(() => S.viewCleanup?.());
  mount(root, loadingView("Menyiapkan akun…"));

  try {
    const uref = doc(db, "users", uid);
    const us = await getDoc(uref);
    if (!us.exists()) {
      await setDoc(uref, { uid, displayName: "", email: user.email || "", approvalStatus: "none", createdAt: serverTimestamp() });
    } else S.name = us.data().displayName || "";
    const gs = await getDoc(doc(db, "groups", GROUP_ID));
    S.group = gs.exists() ? gs.data() : null;
  } catch (e) { return mount(root, errorView("Gagal menyiapkan akun: " + friendlyError(e))); }

  const fail = (e) => mount(root, errorView(friendlyError(e)));
  cleanups.push(onSnapshot(doc(db, "groupMembers", `${GROUP_ID}_${uid}`), (s) => { S.member = s.exists() ? s.data() : null; render(); }, fail));
  cleanups.push(onSnapshot(doc(db, "joinRequests", uid), (s) => {
    const prev = S.req; S.req = s.exists() ? s.data() : null;
    if (prev && S.req && prev.status !== S.req.status) notifyDecision(S.req);
    render();
  }, fail));

  function render() {
    if (S.member === undefined || S.req === undefined) return;
    let target;
    if (S.member?.status === "active") target = "chat";
    else if (S.member?.status === "restricted") target = "restricted";
    else if (!S.req) target = S.step === "record" ? "record" : "rules";
    else if (S.req.status === "rejected" && S.step === "record") target = "record";
    else target = "waiting";
    if (target === "chat" && S.view === "chat") return;
    S.viewCleanup?.(); S.viewCleanup = null; S.view = target;
    const go = (step) => { S.step = step; render(); };
    if (target === "chat") { const v = chatView(S, user); S.viewCleanup = v.cleanup; mount(root, v.node); }
    else if (target === "restricted") mount(root, restrictedView());
    else if (target === "rules") mount(root, rulesView(S, uid, go));
    else if (target === "record") { const v = recordView(S, uid, go); S.viewCleanup = v.cleanup; mount(root, v.node); }
    else mount(root, waitingView(S, uid, go));
  }
}

function notifyDecision(req) {

}

/* ======================= HALAMAN 3: REKAM SUARA ======================= */
function recordView(S, uid, go) {
  const maxSec = Number(S.group?.maxRecordSeconds) || 15, minSec = 2;
  let stream, mr, chunks = [], blob = null, startedAt = 0, tick = null, raf = null, actx = null, analyser = null, dur = 0;
  const canvas = h("canvas", { class: "waveform", width: 600, height: 180 });
  const timer = h("div", { class: "timer" }, "00:00");
  const err = h("div", { class: "error", role: "alert" });
  const player = h("audio", { controls: true, class: "hidden" });
  const prog = h("progress", { class: "hidden", max: "100", value: "0" });
  const startBtn = h("button", { class: "btn primary" }, "🎙 Mulai Rekam");
  const stopBtn = h("button", { class: "btn danger hidden" }, "⏹ Berhenti");
  const redoBtn = h("button", { class: "btn ghost hidden" }, "↺ Rekam Ulang");
  const sendBtn = h("button", { class: "btn primary hidden" }, "Kirim ke Admin Sela");
  const fmt = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");

  function pickMime() {
    for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"]) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    return "";
  }
  function draw() {
    const c = canvas.getContext("2d"), W = canvas.width, H = canvas.height;
    const data = new Uint8Array(analyser.fftSize);
    const loop = () => {
      analyser.getByteTimeDomainData(data);
      c.clearRect(0, 0, W, H);
      const grad = c.createLinearGradient(0, 0, W, 0); grad.addColorStop(0, "#8b5cf6"); grad.addColorStop(1, "#ec4899");
      c.strokeStyle = grad; c.lineWidth = 3; c.beginPath();
      for (let i = 0; i < data.length; i++) { const x = (i / data.length) * W, y = (data[i] / 255) * H; i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.stroke(); raf = requestAnimationFrame(loop);
    };
    loop();
  }
  function stopStream() { stream?.getTracks().forEach((t) => t.stop()); try { actx?.close(); } catch {} cancelAnimationFrame(raf); clearInterval(tick); }

  startBtn.onclick = async () => {
    err.textContent = "";
    if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) { err.textContent = "Browser ini tidak mendukung perekaman. Gunakan Chrome terbaru dan buka lewat https."; return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { err.textContent = "Izin mikrofon ditolak. Aktifkan izin mikrofon di pengaturan situs browser, lalu coba lagi."; return; }
    const mime = pickMime(); chunks = []; blob = null;
    mr = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: 24000 });
    mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    mr.onstop = () => {
      dur = (Date.now() - startedAt) / 1000; stopStream();
      blob = new Blob(chunks, { type: mr.mimeType || mime || "audio/webm" });
      if (dur < minSec || blob.size < 2000) { blob = null; err.textContent = `Rekaman terlalu singkat atau kosong (minimal ${minSec} detik). Silakan rekam ulang.`; startBtn.classList.remove("hidden"); return; }
      player.src = URL.createObjectURL(blob); player.classList.remove("hidden");
      redoBtn.classList.remove("hidden"); sendBtn.classList.remove("hidden");
    };
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser(); analyser.fftSize = 1024; actx.createMediaStreamSource(stream).connect(analyser);
    draw(); mr.start(250); startedAt = Date.now();
    startBtn.classList.add("hidden"); stopBtn.classList.remove("hidden");
    tick = setInterval(() => { const s = (Date.now() - startedAt) / 1000; timer.textContent = fmt(s) + " / " + fmt(maxSec); if (s >= maxSec) stopBtn.click(); }, 200);
  };
  stopBtn.onclick = () => { stopBtn.classList.add("hidden"); if (mr && mr.state !== "inactive") mr.stop(); };
  redoBtn.onclick = () => {
    blob = null; player.classList.add("hidden"); player.removeAttribute("src"); redoBtn.classList.add("hidden"); sendBtn.classList.add("hidden");
    startBtn.classList.remove("hidden"); timer.textContent = "00:00"; err.textContent = "";
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  };
  sendBtn.onclick = async () => {
    if (!blob) return;
    err.textContent = ""; sendBtn.disabled = redoBtn.disabled = true; sendBtn.textContent = "Mengunggah…"; prog.classList.remove("hidden");
    try {
      const dataUrl = await blobToDataURL(blob); if (dataUrl.length > 700000) throw new Error("Rekaman terlalu besar. Rekam lebih singkat.");
      await setDoc(doc(db, "joinAudio", uid), { uid, data: dataUrl, mime: blob.type, createdAt: serverTimestamp() });
      const data = { uid, hasAudio: true, status: "pending", submittedAt: serverTimestamp(), reviewedAt: null, reviewedBy: null, rejectionReason: null, canResubmit: false };
      if (S.req) await updateDoc(doc(db, "joinRequests", uid), data); else await setDoc(doc(db, "joinRequests", uid), data);
      toast("Tunggu admin Sela menyetujui dulu yah.", "good");
      S.step = null; // listener real-time akan menampilkan halaman menunggu
    } catch (e) {
      err.textContent = "Gagal mengirim: " + friendlyError(e); sendBtn.disabled = redoBtn.disabled = false; sendBtn.textContent = "Kirim ke Admin Sela"; prog.classList.add("hidden");
    }
  };

  return {
    cleanup: stopStream,
    node: h("div", { class: "screen" }, h("h1", {}, "Rekam Suara"),
      h("div", { class: "card stack" },
        h("p", {}, "Ucapkan: ", h("b", {}, "“Halo Kak Sela, gabung dong.”"), ` (maks. ${maxSec} detik)`),
        canvas, timer, startBtn, stopBtn, player, redoBtn, sendBtn, prog, err),
      h("button", { class: "btn ghost small", onclick: () => { S.step = "rules"; go("rules"); } }, "← Kembali")),
  };
}

    const nm = h("input", { class: "input", maxlength: "40", value: baseName(uid) === "Anggota" ? "" : baseName(uid), placeholder: "Nama panggilan" });
    let photo = null;
    const pf = h("input", { type: "file", accept: "image/*", class: "hidden" });
    const pv = h("button", { class: "btn ghost small" }, "📷 Ganti foto profil");
    pv.onclick = () => pf.click();
    pf.onchange = async () => {
      const f = pf.files[0]; pf.value = ""; if (!f) return; e2.textContent = "";
      try { photo = await compressImage(f, 192, 0.7, 50000); pv.textContent = "✓ Foto baru dipilih (tekan Simpan)"; } catch (er) { e2.textContent = er.message || "Foto tidak dapat diproses."; }
    };
    const sv = h("button", { class: "btn primary" }, "Simpan profil");
    sv.onclick = async () => {
      const n = nm.value.trim(); if (n.length < 2) { e2.textContent = "Nama minimal 2 huruf."; return; }
      sv.disabled = true; sv.textContent = "Menyimpan…"; e2.textContent = "";
      try {
        await updateDoc(doc(db, "profiles", uid), { displayName: n, ...(photo ? { photoURL: photo } : {}), updatedAt: serverTimestamp() });
        toast("Profil diperbarui", "good"); done();
      } catch (er) { e2.textContent = friendlyError(er); sv.disabled = false; sv.textContent = "Simpan profil"; }
    };
    return h("div", { class: "stack", style: "text-align:left" }, h("label", { class: "muted small" }, "Ubah nama"), nm, pf, pv, sv, e2);
  }
  function openGroup() {
    const big = g.photoURL ? h("img", { class: "avatar", src: g.photoURL, alt: "", style: "width:96px;height:96px;margin:auto" }) : h("div", { class: "avatar", style: "width:96px;height:96px;font-size:2.4rem;margin:auto" }, "S");
    let close = () => {};
    close = openSheet("Profil grup", h("div", { class: "stack", style: "text-align:center" },
      big, h("h2", {}, g.name || "Grup Sela"),
      g.description ? h("p", { class: "muted" }, g.description) : null,
      h("p", { class: "muted" }, `${members.length} anggota · ${members.filter((m) => online[m.uid]).length} online`),
      h("div", { class: "row" },
        h("button", { class: "btn ghost grow", onclick: () => { close(); openMembers(); } }, "👥 Anggota"),
        h("button", { class: "btn ghost grow", onclick: () => { close(); openGallery(); } }, "🖼 Galeri")),
      h("p", { class: "muted small" }, "Admin Sela (083899891468) dapat meninjau foto/video yang dikirim ke grup dan dapat bergabung sebagai pemantau di panggilan; anggota selalu diberi tahu saat itu terjadi."),
      g.rulesText ? h("details", { style: "text-align:left" }, h("summary", {}, "Aturan grup"), h("p", { class: "muted", style: "white-space:pre-wrap" }, g.rulesText)) : null));
  }
  function openGallery() {
    const imgs = lastDocs.filter((m) => m.imageData || m.videoData || m.mediaKey).reverse();
    openSheet("Galeri foto & video", imgs.length
      ? h("div", {}, h("div", { class: "gallery" }, imgs.map((m) => mediaEl(m, { tile: true, onOpen: () => viewImage(m) }))), h("p", { class: "muted small" }, "Menampilkan foto dari pesan-pesan terbaru."))
      : h("p", { class: "muted" }, "Belum ada foto."));
  }
  function viewImage(m) { openViewer(m, { title: nameOf(m.senderUid), sub: fmtDateTime(m.createdAt), canSave: false }); }
  function openRooms() {
    if (call.callId) return toast("Akhiri panggilan yang sedang berjalan dulu.", "err");
    let data = {}; let close = () => {};
    const cam = h("input", { type: "checkbox", checked: true });
    const listEl = h("div", { class: "rooms-list" });
    const paint = () => listEl.replaceChildren(...roomIds.map((id) => {
      const f = freshMembers(data[id]); const full = f.length >= ROOM_CAP;
      return h("div", { class: "list-item" },
        h("div", { class: "grow" }, h("b", {}, "Room " + id.slice(1)),
          h("div", { class: full ? "error small" : "muted small" }, full ? "Room ini sudah penuh (10/10). Silakan pindah ke Room lain." : `${f.length}/10 · ` + (f.length ? f.slice(0, 3).map((m) => nameOf(m.uid)).join(", ") + (f.length > 3 ? "…" : "") : "kosong"))),
        h("button", { class: "btn " + (full ? "ghost" : "primary") + " small", disabled: full, onclick: () => { close(); rooms.join(id, cam.checked); } }, full ? "Penuh" : "Masuk"));
    }));
    const un = onSnapshot(collection(db, "rooms"), (sn) => { data = {}; sn.forEach((d) => (data[d.id] = d.data())); paint(); }, () => {});
    close = openSheet("Room panggilan (1–10)", h("div", { class: "stack" },
      h("label", { class: "checkrow" }, cam, "Masuk dengan kamera"),
      h("p", { class: "muted small" }, "Satu room maksimal 10 orang. Kamu bisa masuk sendiri tanpa menunggu anggota lain. Jika banyak peserta, matikan kamera agar lancar."),
      listEl));
    paint();
    const w = setInterval(() => { if (!listEl.isConnected) { clearInterval(w); un(); } }, 1000);
  }
  function pickPeer(video) {
    const others = members.filter((m) => m.uid !== uid);
    let close;
    close = openSheet(video ? "Video call ke…" : "Telepon ke…", others.length ? h("div", {}, others.map((m) => memberRow(m, () => { close(); call.startCall(m.uid, video); }))) : h("p", { class: "muted" }, "Belum ada anggota lain."));
  }

  function renderMsgs() {
    const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 140;
    list.replaceChildren(...lastDocs.map(msgNode));
    if (nearBottom || firstLoad) list.scrollTop = list.scrollHeight;
  }

  // Pesan real-time (100 terbaru)
  unsubs.push(onSnapshot(query(collection(db, "messages"), where("groupId", "==", GROUP_ID), orderBy("createdAt", "desc"), limit(40)), { includeMetadataChanges: true }, (snap) => {
    lastDocs = snap.docs.map((d) => ({ id: d.id, ...d.data(), _pending: d.metadata.hasPendingWrites })).reverse();
    if (!firstLoad) snap.docChanges().forEach((c) => {
      const d = c.doc.data();
      if (c.type === "added" && d.senderUid !== uid && !c.doc.metadata.hasPendingWrites) {
        const body = d.text || (d.messageType === "image" ? "📷 Foto" : "🎥 Video");
        if (document.hidden) { try { if (Notification.permission === "granted") new Notification(nameOf(d.senderUid), { body }); } catch {} }
        else toast(nameOf(d.senderUid) + ": " + body.slice(0, 60));
      }
    });
    renderMsgs(); firstLoad = false;
    if (!document.hidden) lastDocs.forEach((m) => { if (m.senderUid !== uid && !m._pending && !(m.readBy || {})[uid]) updateDoc(doc(db, "messages", m.id), { ["readBy." + uid]: true }).catch(() => {}); });
  }, (e) => toast("Pesan gagal dimuat: " + friendlyError(e), "err")));

  setTimeout(askPermissions, 1500);

  return {
    node: h("div", { class: "chat" }, head, pinBar, list, replyBar, composer),
    cleanup: () => { unsubs.forEach((f) => { try { f(); } catch {} }); call.destroy(); },
  };
}

</script></body></html>
