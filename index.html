/* ---------- DOM helper (aman dari XSS: tidak memakai innerHTML) ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function mount(root, node) { root.replaceChildren(node); }

function toast(msg, kind = "") {
  const t = h("div", { class: "toast " + kind }, msg);
  document.body.append(t);
  setTimeout(() => t.classList.add("show"), 10);
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3500);
}

  document.body.append(ov);
  return close;
}

function fmtTime(ts) {
  const d = ts?.toDate ? ts.toDate() : ts instanceof Date ? ts : null;

}
function fmtDateTime(ts) {
  const d = ts?.toDate ? ts.toDate() : ts instanceof Date ? ts : null;
  return d ? d.toLocaleString("id-ID", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "-";
}
function maskPhone(p) { return p ? p.slice(0, 5) + "•••••" + p.slice(-3) : "-"; }

function friendlyError(e) {
  const c = e?.code || "";
  const map = {
    "auth/invalid-verification-code": "Kode OTP salah. Periksa lagi dan coba kembali.",
    "auth/code-expired": "Kode OTP sudah kedaluwarsa. Kirim ulang OTP.",

    "auth/network-request-failed": "Koneksi internet bermasalah.",
    "auth/captcha-check-failed": "Verifikasi reCAPTCHA gagal. Muat ulang halaman.",
    "auth/operation-not-allowed": "Login telepon belum diaktifkan di Firebase Console.",
    "permission-denied": "Akses ditolak oleh aturan keamanan server.",
    "unavailable": "Server tidak dapat dihubungi. Periksa koneksi internet.",
  };
  return map[c] || map[c.replace("firestore/", "")] || (e?.message ? "Terjadi kesalahan: " + e.message : "Terjadi kesalahan.");
}

/* ---------- Login nomor telepon + OTP (dipakai aplikasi anggota dan admin) ---------- */
function loginView(title = "Sela Group Chat", subtitle = "Masuk dengan nomor telepon") {
  let confirmation = null, verifier = null, cdTimer = null;
  const err = h("div", { class: "error", role: "alert" });
  const rcHost = h("div");
  const phone = h("input", { class: "input", type: "tel", inputmode: "tel", autocomplete: "tel", placeholder: "+6281234567890", value: "+62" });
  const otp = h("input", { class: "input otp", type: "text", inputmode: "numeric", maxlength: "6", autocomplete: "one-time-code", placeholder: "••••••" });
  const sendBtn = h("button", { class: "btn primary", onclick: send }, "Kirim OTP");
  const verBtn = h("button", { class: "btn primary", onclick: verify }, "Verifikasi");
  const resend = h("button", { class: "btn ghost", onclick: send, disabled: true }, "Kirim ulang OTP");
  const otpBox = h("div", { class: "stack hidden" }, h("label", {}, "Kode OTP (6 digit)"), otp, verBtn, resend);

  function busy(btn, on, text) {
    btn.disabled = on;
    if (on) { btn.dataset.t = btn.textContent; btn.textContent = text; } else if (btn.dataset.t) btn.textContent = btn.dataset.t;
  }
  function countdown() {
    let s = 60; resend.disabled = true; clearInterval(cdTimer);
    cdTimer = setInterval(() => {
      s--; resend.textContent = s > 0 ? `Kirim ulang OTP (${s}s)` : "Kirim ulang OTP";
      if (s <= 0) { clearInterval(cdTimer); resend.disabled = false; }
    }, 1000);
  }
  async function send() {
    err.textContent = "";
    const p = phone.value.replace(/[\s-]/g, "");
    if (!/^\+[1-9]\d{7,14}$/.test(p)) { err.textContent = "Gunakan kode negara, contoh +6281234567890."; return; }
    busy(sendBtn, true, "Mengirim…");
    try {
      try { verifier?.clear(); } catch {}
      const holder = h("div"); rcHost.replaceChildren(holder);
      verifier = new RecaptchaVerifier(auth, holder, { size: "invisible" });
      confirmation = await signInWithPhoneNumber(auth, p, verifier);
      otpBox.classList.remove("hidden"); otp.focus(); countdown();
    } catch (e) { err.textContent = friendlyError(e); confirmation = null; }
    finally { busy(sendBtn, false); }
  }
  async function verify() {
    err.textContent = "";
    if (!confirmation) { err.textContent = "Kirim OTP terlebih dahulu."; return; }
    if (!/^\d{6}$/.test(otp.value.trim())) { err.textContent = "Masukkan 6 digit kode OTP."; return; }
    busy(verBtn, true, "Memverifikasi…");
    try { await confirmation.confirm(otp.value.trim()); }
    catch (e) { err.textContent = friendlyError(e); busy(verBtn, false); }
  }
  return h("div", { class: "screen center" }, h("div", { class: "card stack login" },
    h("div", { class: "logo" }, "S"), h("h1", {}, title), h("p", { class: "muted" }, subtitle),
    h("label", {}, "Nomor telepon (dengan kode negara)"), phone, sendBtn, otpBox, err, rcHost,
    h("button", { class: "btn ghost small", onclick: toggleTheme }, "🌓 Mode gelap/terang")));
}

/* ---------- Tanpa Firebase Storage: file kecil disimpan sebagai data URL di Firestore ---------- */
function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Gagal membaca file."));
    r.readAsDataURL(blob);
  });
}
async function compressImage(file, maxDim = 800, q = 0.6, maxChars = 220000) {
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) throw new Error("Foto tidak dapat dibaca.");
  const sc = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  for (let qq = q; qq >= 0.29; qq -= 0.1) { const d = c.toDataURL("image/jpeg", qq); if (d.length <= maxChars) return d; }
  throw new Error("Foto terlalu besar setelah dikompres.");
}

/*
 * Panggilan video 1-lawan-1 dengan WebRTC. Signaling lewat Firestore:
 *   calls/{id}  -> offer, answer, status (ringing|accepted|rejected|ended|missed)
 *   calls/{id}/callerCandidates, calls/{id}/receiverCandidates -> ICE candidates
 * Tanpa server TURN, panggilan bisa gagal pada sebagian jaringan seluler/NAT ketat.

class CallManager {
  constructor({ db, uid, groupId, nameOf, root }) {
    Object.assign(this, { db, uid, groupId, nameOf, root });
    this.pc = null; this.local = null; this.ui = null; this.unsubs = []; this.callId = null;
    this.facing = "user"; this.ended = false; this.video = true; this.ringTimer = null; this.discTimer = null;
  }

  listenIncoming() {
    const q = query(collection(this.db, "calls"), where("receiverUid", "==", this.uid), where("status", "==", "ringing"));
    const un = onSnapshot(q, (snap) => {
      snap.docChanges().forEach((c) => {
        if (c.type !== "added") return;
        const d = c.doc.data();
        const created = d.createdAt?.toMillis?.() ?? Date.now();
        if (Date.now() - created > 60000) return; // panggilan lama diabaikan
        if (this.callId) { updateDoc(c.doc.ref, { status: "rejected", endedAt: serverTimestamp() }).catch(() => {}); return; } // sedang sibuk
        this.showIncoming(c.doc.id, d);
      });
    }, () => {});
    this.unsubs.push(un);
    return un;
  }

  destroy() { this.cleanup(); this.unsubs.forEach((f) => { try { f(); } catch {} }); this.unsubs = []; }

  /* ---------- UI ---------- */
  buildUI(title, withVideo) {
    this.closeUI();
    const remote = h("video", { class: "remote", autoplay: true, playsinline: true });
    const local = h("video", { class: "local", autoplay: true, playsinline: true, muted: true });
    local.muted = true;
    const status = h("div", {}, "Menghubungkan…");
    const ctrls = h("div", { class: "ctrls" });
    const el = h("div", { class: "call" }, remote, withVideo ? local : null, h("div", { class: "top" }, h("b", {}, title), status), ctrls);
    this.root.append(el);
    this.ui = { el, remote, local, status, ctrls };
    return this.ui;
  }
  closeUI() { this.ui?.el.remove(); this.ui = null; }
  setStatus(t) { if (this.ui) this.ui.status.textContent = t; }

  controls(withVideo) {
    const { ctrls } = this.ui;
    const mic = h("button", { class: "cbtn", "aria-label": "Mikrofon" }, "🎤");
    const cam = h("button", { class: "cbtn", "aria-label": "Kamera" }, "📷");
    const flip = h("button", { class: "cbtn", "aria-label": "Balik kamera" }, "🔄");
    const end = h("button", { class: "cbtn end", "aria-label": "Akhiri" }, "📵");
    mic.onclick = () => { const t = this.local?.getAudioTracks()[0]; if (!t) return; t.enabled = !t.enabled; mic.classList.toggle("off", !t.enabled); mic.textContent = t.enabled ? "🎤" : "🔇"; };
    cam.onclick = () => { const t = this.local?.getVideoTracks()[0]; if (!t) return; t.enabled = !t.enabled; cam.classList.toggle("off", !t.enabled); };
    flip.onclick = () => this.flipCamera();
    end.onclick = () => this.hangup();
    ctrls.replaceChildren(mic, ...(withVideo ? [cam, flip] : []), end);
  }

  async flipCamera() {
    if (!this.local || !this.pc) return;
    try {
      const next = this.facing === "user" ? "environment" : "user";
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: next } } });
      const nt = s.getVideoTracks()[0];
      const sender = this.pc.getSenders().find((x) => x.track?.kind === "video");
      if (sender) await sender.replaceTrack(nt);
      this.local.getVideoTracks().forEach((t) => { t.stop(); this.local.removeTrack(t); });
      this.local.addTrack(nt); this.ui.local.srcObject = this.local; this.facing = next;
    } catch { toast("Tidak dapat beralih kamera.", "err"); }
  }

  async getMedia(video) {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("Browser tidak mendukung panggilan. Buka lewat https di Chrome.");
    try {
      return await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: this.facing } : false });
    } catch { throw new Error("Izin kamera/mikrofon ditolak. Aktifkan di pengaturan situs lalu coba lagi."); }
  }

  makePC(callId, side) {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    this.pc = pc;
    this.local.getTracks().forEach((t) => pc.addTrack(t, this.local));
    pc.ontrack = (e) => { if (this.ui) { this.ui.remote.srcObject = e.streams[0]; } };
    const mine = collection(this.db, "calls", callId, side + "Candidates");
    pc.onicecandidate = (e) => { if (e.candidate) addDoc(mine, e.candidate.toJSON()).catch(() => {}); };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === "connected") { clearTimeout(this.discTimer); this.setStatus("Panggilan berlangsung"); }
      else if (s === "connecting") this.setStatus("Menghubungkan…");
      else if (s === "disconnected") {
        this.setStatus("Koneksi tidak stabil, mencoba menyambung kembali…");
        clearTimeout(this.discTimer); this.discTimer = setTimeout(() => { if (this.pc?.connectionState !== "connected") this.fail("Koneksi terputus."); }, 12000);
      } else if (s === "failed") this.fail("Koneksi gagal. Jaringan mungkin memerlukan server TURN.");
    };
    // Dengarkan candidate dari pihak lain
    // Candidate dari pihak lain ditahan sampai remote description terpasang.
    const other = side === "caller" ? "receiver" : "caller";
    this.pending = [];
    this.unsubCall(onSnapshot(collection(this.db, "calls", callId, other + "Candidates"), (s) => {
      s.docChanges().forEach((c) => {
        if (c.type !== "added") return;
        if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(() => {});
        else this.pending.push(c.doc.data());
      });
    }, () => {}));
    return pc;
  }
  async setRemote(desc) {
    await this.pc.setRemoteDescription(new RTCSessionDescription(desc));
    (this.pending || []).splice(0).forEach((c) => this.pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}));
  }
  unsubCall(f) { (this.callUnsubs ||= []).push(f); }

  /* ---------- Penelepon ---------- */
  async startCall(peerUid, video = true) {
    if (this.callId) return toast("Kamu sedang dalam panggilan.", "err");
    this.ended = false; this.video = video;
    const ui = this.buildUI("Memanggil " + this.nameOf(peerUid) + "…", video);
    this.controls(video);
    try {
      this.local = await this.getMedia(video); ui.local && (ui.local.srcObject = this.local);
      const ref = await addDoc(collection(this.db, "calls"), {
        callerUid: this.uid, receiverUid: peerUid, groupId: this.groupId, status: "ringing", video, createdAt: serverTimestamp(), startedAt: null, endedAt: null, answer: null, offer: null,
      });
      this.callId = ref.id;
      const pc = this.makePC(ref.id, "caller");
      const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
      await updateDocSafe(ref, { offer: { type: offer.type, sdp: offer.sdp } }, true);
      this.setStatus("Berdering…");
      this.ringTimer = setTimeout(() => { if (!this.ended && this.pc?.connectionState !== "connected") { updateDoc(ref, { status: "missed", endedAt: serverTimestamp() }).catch(() => {}); this.fail("Tidak dijawab."); } }, 45000);
      this.unsubCall(onSnapshot(ref, (s) => {
        const d = s.data(); if (!d) return;
        if (d.answer && !pc.currentRemoteDescription) { this.setRemote(d.answer).catch(() => {}); clearTimeout(this.ringTimer); this.setStatus("Menghubungkan…"); }
        if (d.status === "rejected") this.fail("Panggilan ditolak.");
        if (d.status === "ended") this.fail("Panggilan diakhiri.");
      }));
    } catch (e) { this.fail(e.message || "Gagal memulai panggilan."); }
  }

  /* ---------- Penerima ---------- */
  showIncoming(callId, d) {
    this.callId = callId; this.ended = false; this.video = !!d.video;
    const ui = this.buildUI(this.nameOf(d.callerUid), false);
    ui.remote.classList.add("hidden");
    const info = h("div", { class: "center-info" }, h("div", { class: "pulse" }, "📞"), h("h2", {}, this.nameOf(d.callerUid)), h("p", {}, d.video ? "Panggilan video masuk…" : "Panggilan suara masuk…"));
    ui.el.append(info);
    const acc = h("button", { class: "cbtn acc", "aria-label": "Terima" }, "📞"), rej = h("button", { class: "cbtn end", "aria-label": "Tolak" }, "✕");
    ui.ctrls.replaceChildren(rej, acc);
    const ref = doc(this.db, "calls", callId);
    this.unsubCall(onSnapshot(ref, (s) => { const x = s.data(); if (x && ["ended", "missed"].includes(x.status)) this.fail("Panggilan berakhir."); }));
    rej.onclick = async () => { await updateDoc(ref, { status: "rejected", endedAt: serverTimestamp() }).catch(() => {}); this.cleanup(); };
    acc.onclick = () => this.accept(callId, d, info);
  }

  async accept(callId, d, info) {
    const ref = doc(this.db, "calls", callId);
    try {
      info.remove(); this.ui.remote.classList.remove("hidden");
      if (d.video) { /* tampilkan video lokal */ const l = h("video", { class: "local", autoplay: true, playsinline: true }); l.muted = true; this.ui.el.insertBefore(l, this.ui.ctrls); this.ui.local = l; }
      this.controls(!!d.video); this.setStatus("Menghubungkan…");
      this.local = await this.getMedia(!!d.video); if (this.ui.local) this.ui.local.srcObject = this.local;
      const pc = this.makePC(callId, "receiver");
      // Offer bisa belum ada saat notifikasi pertama datang, jadi ambil data terbaru.
      let offer = d.offer;
      if (!offer) offer = (await getDoc(ref)).data()?.offer;
      if (!offer) throw new Error("Data panggilan tidak lengkap.");
      await this.setRemote(offer);
      const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
      await updateDoc(ref, { answer: { type: answer.type, sdp: answer.sdp }, status: "accepted", startedAt: serverTimestamp() });
    } catch (e) { await updateDoc(ref, { status: "ended", endedAt: serverTimestamp() }).catch(() => {}); this.fail(e.message || "Gagal menerima panggilan."); }
  }

  async hangup() {
    if (this.callId) await updateDoc(doc(this.db, "calls", this.callId), { status: "ended", endedAt: serverTimestamp() }).catch(() => {});
    this.cleanup();
  }
  fail(msg) { if (this.ended) return; toast(msg, "err"); this.cleanup(); }
  cleanup() {
    this.ended = true; clearTimeout(this.ringTimer); clearTimeout(this.discTimer);
    (this.callUnsubs || []).forEach((f) => { try { f(); } catch {} }); this.callUnsubs = [];
    try { this.pc?.close(); } catch {} this.pc = null;
    this.local?.getTracks().forEach((t) => t.stop()); this.local = null;
    this.callId = null; this.closeUI();
  }
}

// updateDoc yang mengembalikan error jelas jika gagal

/* ======================= ALUR UTAMA ======================= */
async function boot(user) {
  const uid = user.uid;
  const S = { step: null, member: undefined, req: undefined, view: null, viewCleanup: null, group: null, name: "" };
  cleanups.push(() => S.viewCleanup?.());
  mount(root, loadingView("Menyiapkan akun…"));

  try {
    const uref = doc(db, "users", uid);
    const us = await getDoc(uref);
    if (!us.exists()) {
      await setDoc(uref, { uid, displayName: "", phoneNumber: user.phoneNumber, approvalStatus: "none", createdAt: serverTimestamp() });
    } else S.name = us.data().displayName || "";
    const gs = await getDoc(doc(db, "groups", GROUP_ID));
    S.group = gs.exists() ? gs.data() : null;
  } catch (e) { return mount(root, errorView("Gagal menyiapkan akun: " + friendlyError(e))); }

  const fail = (e) => mount(root, errorView(friendlyError(e)));
  cleanups.push(onSnapshot(doc(db, "groupMembers", `${GROUP_ID}_${uid}`), (s) => { S.member = s.exists() ? s.data() : null; render(); }, fail));
  cleanups.push(onSnapshot(doc(db, "joinRequests", uid), (s) => {
    const prev = S.req; S.req = s.exists() ? s.data() : null;
    if (prev && S.req && prev.status !== S.req.status) notifyDecision(S.req);
    render();
  }, fail));

  function render() {
    if (S.member === undefined || S.req === undefined) return;
    let target;
    if (S.member?.status === "active") target = "chat";
    else if (S.member?.status === "restricted") target = "restricted";
    else if (!S.req) target = S.step === "record" ? "record" : "rules";
    else if (S.req.status === "rejected" && S.step === "record") target = "record";
    else target = "waiting";
    if (target === "chat" && S.view === "chat") return;
    S.viewCleanup?.(); S.viewCleanup = null; S.view = target;
    const go = (step) => { S.step = step; render(); };
    if (target === "chat") { const v = chatView(S, user); S.viewCleanup = v.cleanup; mount(root, v.node); }
    else if (target === "restricted") mount(root, restrictedView());
    else if (target === "rules") mount(root, rulesView(S, uid, go));
    else if (target === "record") { const v = recordView(S, uid, go); S.viewCleanup = v.cleanup; mount(root, v.node); }
    else mount(root, waitingView(S, uid, go));
  }
}

function notifyDecision(req) {
  const ok = req.status === "approved";
  const msg = ok ? "Pengajuanmu disetujui admin Sela 🎉" : "Pengajuanmu ditolak admin Sela.";
  toast(msg, ok ? "good" : "err");
  try { if ("Notification" in window && Notification.permission === "granted") new Notification("Sela Group Chat", { body: msg }); } catch {}
}

/* ======================= HALAMAN 3: REKAM SUARA ======================= */
function recordView(S, uid, go) {
  const maxSec = Number(S.group?.maxRecordSeconds) || 15, minSec = 2;
  let stream, mr, chunks = [], blob = null, startedAt = 0, tick = null, raf = null, actx = null, analyser = null, dur = 0;
  const canvas = h("canvas", { class: "waveform", width: 600, height: 180 });
  const timer = h("div", { class: "timer" }, "00:00");
  const err = h("div", { class: "error", role: "alert" });
  const player = h("audio", { controls: true, class: "hidden" });
  const prog = h("progress", { class: "hidden", max: "100", value: "0" });
  const startBtn = h("button", { class: "btn primary" }, "🎙 Mulai Rekam");
  const stopBtn = h("button", { class: "btn danger hidden" }, "⏹ Berhenti");
  const redoBtn = h("button", { class: "btn ghost hidden" }, "↺ Rekam Ulang");
  const sendBtn = h("button", { class: "btn primary hidden" }, "Kirim ke Admin Sela");
  const fmt = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");

  function pickMime() {
    for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"]) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    return "";
  }
  function draw() {
    const c = canvas.getContext("2d"), W = canvas.width, H = canvas.height;
    const data = new Uint8Array(analyser.fftSize);
    const loop = () => {
      analyser.getByteTimeDomainData(data);
      c.clearRect(0, 0, W, H);
      const grad = c.createLinearGradient(0, 0, W, 0); grad.addColorStop(0, "#8b5cf6"); grad.addColorStop(1, "#ec4899");
      c.strokeStyle = grad; c.lineWidth = 3; c.beginPath();
      for (let i = 0; i < data.length; i++) { const x = (i / data.length) * W, y = (data[i] / 255) * H; i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.stroke(); raf = requestAnimationFrame(loop);
    };
    loop();
  }
  function stopStream() { stream?.getTracks().forEach((t) => t.stop()); try { actx?.close(); } catch {} cancelAnimationFrame(raf); clearInterval(tick); }

  startBtn.onclick = async () => {
    err.textContent = "";
    if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) { err.textContent = "Browser ini tidak mendukung perekaman. Gunakan Chrome terbaru dan buka lewat https."; return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { err.textContent = "Izin mikrofon ditolak. Aktifkan izin mikrofon di pengaturan situs browser, lalu coba lagi."; return; }
    const mime = pickMime(); chunks = []; blob = null;
    mr = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: 24000 });
    mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    mr.onstop = () => {
      dur = (Date.now() - startedAt) / 1000; stopStream();
      blob = new Blob(chunks, { type: mr.mimeType || mime || "audio/webm" });
      if (dur < minSec || blob.size < 2000) { blob = null; err.textContent = `Rekaman terlalu singkat atau kosong (minimal ${minSec} detik). Silakan rekam ulang.`; startBtn.classList.remove("hidden"); return; }
      player.src = URL.createObjectURL(blob); player.classList.remove("hidden");
      redoBtn.classList.remove("hidden"); sendBtn.classList.remove("hidden");
    };
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser(); analyser.fftSize = 1024; actx.createMediaStreamSource(stream).connect(analyser);
    draw(); mr.start(250); startedAt = Date.now();
    startBtn.classList.add("hidden"); stopBtn.classList.remove("hidden");
    tick = setInterval(() => { const s = (Date.now() - startedAt) / 1000; timer.textContent = fmt(s) + " / " + fmt(maxSec); if (s >= maxSec) stopBtn.click(); }, 200);
  };
  stopBtn.onclick = () => { stopBtn.classList.add("hidden"); if (mr && mr.state !== "inactive") mr.stop(); };
  redoBtn.onclick = () => {
    blob = null; player.classList.add("hidden"); player.removeAttribute("src"); redoBtn.classList.add("hidden"); sendBtn.classList.add("hidden");
    startBtn.classList.remove("hidden"); timer.textContent = "00:00"; err.textContent = "";
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  };
  sendBtn.onclick = async () => {
    if (!blob) return;
    err.textContent = ""; sendBtn.disabled = redoBtn.disabled = true; sendBtn.textContent = "Mengunggah…"; prog.classList.remove("hidden");
    try {
      const dataUrl = await blobToDataURL(blob); if (dataUrl.length > 700000) throw new Error("Rekaman terlalu besar. Rekam lebih singkat.");
      await setDoc(doc(db, "joinAudio", uid), { uid, data: dataUrl, mime: blob.type, createdAt: serverTimestamp() });
      const data = { uid, hasAudio: true, status: "pending", submittedAt: serverTimestamp(), reviewedAt: null, reviewedBy: null, rejectionReason: null, canResubmit: false };
      if (S.req) await updateDoc(doc(db, "joinRequests", uid), data); else await setDoc(doc(db, "joinRequests", uid), data);
      toast("Tunggu admin Sela menyetujui dulu yah.", "good");
      S.step = null; // listener real-time akan menampilkan halaman menunggu
    } catch (e) {
      err.textContent = "Gagal mengirim: " + friendlyError(e); sendBtn.disabled = redoBtn.disabled = false; sendBtn.textContent = "Kirim ke Admin Sela"; prog.classList.add("hidden");
    }
  };

  return {
    cleanup: stopStream,
    node: h("div", { class: "screen" }, h("h1", {}, "Rekam Suara"),
      h("div", { class: "card stack" },
        h("p", {}, "Ucapkan: ", h("b", {}, "“Halo Kak Sela, gabung dong.”"), ` (maks. ${maxSec} detik)`),
        canvas, timer, startBtn, stopBtn, player, redoBtn, sendBtn, prog, err),
      h("button", { class: "btn ghost small", onclick: () => { S.step = "rules"; go("rules"); } }, "← Kembali")),
  };
}

/* ======================= HALAMAN 4: MENUNGGU ======================= */
function waitingView(S, uid, go) {
  const r = S.req;
  const label = { pending: "Menunggu", approved: "Disetujui", rejected: "Ditolak" }[r.status] || r.status;
  const msg = h("div", { class: "muted" });
  const check = h("button", { class: "btn ghost", onclick: async () => {
    check.disabled = true; msg.textContent = "Memeriksa…";
    try { const s = await getDocFromServer(doc(db, "joinRequests", uid)); msg.textContent = "Status terbaru: " + ({ pending: "Menunggu", approved: "Disetujui", rejected: "Ditolak" }[s.data()?.status] || "-"); }
    catch (e) { msg.textContent = friendlyError(e); } finally { check.disabled = false; }
  } }, "Periksa Status");
  const notif = ("Notification" in window && Notification.permission === "default")
    ? h("button", { class: "btn ghost small", onclick: async () => { await Notification.requestPermission(); go(null); } }, "🔔 Aktifkan notifikasi") : null;
  return h("div", { class: "screen center" }, h("div", { class: "card stack", style: "text-align:center" },
    r.status === "pending" ? h("div", { class: "pulse" }, "🎧") : null,
    h("h2", {}, r.status === "rejected" ? "Pengajuan ditolak" : r.status === "approved" ? "Disetujui, menyiapkan akses…" : "Menunggu persetujuan admin Sela"),
    r.status === "pending" ? h("p", { class: "muted" }, "Tunggu admin Sela menyetujui dulu yah.") : null,
    h("div", {}, "Status: ", h("span", { class: "badge " + r.status }, label)),
    h("p", { class: "muted" }, "Diajukan: " + fmtDateTime(r.submittedAt)),
    r.status === "rejected" ? h("p", { class: "error" }, "Alasan: " + (r.rejectionReason || "Tidak ada alasan yang diberikan.")) : null,
    r.status === "rejected" && r.canResubmit ? h("button", { class: "btn primary", onclick: () => go("record") }, "Ajukan Ulang") : null,
    r.status === "rejected" && !r.canResubmit ? h("p", { class: "muted" }, "Admin tidak mengizinkan pengajuan ulang.") : null,
    check, msg, notif, h("button", { class: "btn ghost small", onclick: () => signOutNow() }, "Keluar")));
}

function restrictedView() {
  return h("div", { class: "screen center" }, h("div", { class: "card stack", style: "text-align:center" },
    h("h2", {}, "Akunmu dibatasi"), h("p", { class: "muted" }, "Admin Sela membatasi akses akunmu ke grup karena pelanggaran aturan."),
    h("button", { class: "btn ghost", onclick: () => signOutNow() }, "Keluar")));
}

/* ======================= HALAMAN 5: GROUP CHAT ======================= */
const EMOJIS = ["😀", "😂", "🥰", "😍", "😘", "😎", "🤗", "😭", "🙏", "👍", "👏", "🔥", "💜", "💖", "✨", "🎉", "😅", "🤔", "😴", "🥳", "😇", "🙈", "💪", "🌸"];
const REACTS = ["❤️", "😂", "👍", "😮", "😢", "🙏"];

function chatView(S, user) {
  const uid = user.uid, g = S.group || {};
  const unsubs = [], profiles = {}, urlCache = {};
  let members = [], online = {}, replyTo = null, firstLoad = true, lastDocs = [];
  const nameOf = (id) => profiles[id]?.displayName || "Anggota";
  const initial = (id) => (nameOf(id)[0] || "?").toUpperCase();

  const call = new CallManager({ db, uid, groupId: GROUP_ID, nameOf, root: document.body });
  unsubs.push(call.listenIncoming());

  // Kehadiran (online/offline) lewat Realtime Database
  const sref = dRef(rtdb, `status/${uid}`);
  unsubs.push(onValue(dRef(rtdb, ".info/connected"), (s) => {
    if (s.val() === false) return;
    onDisconnect(sref).set({ state: "offline", lastChanged: dTs() }).then(() => dSet(sref, { state: "online", lastChanged: dTs() })).catch(() => {});
  }));
  unsubs.push(onValue(dRef(rtdb, "status"), (s) => { online = {}; s.forEach((c) => { online[c.key] = c.val().state === "online"; }); updateHead(); }));
  unsubs.push(() => dSet(sref, { state: "offline", lastChanged: dTs() }).catch(() => {}));

  unsubs.push(onSnapshot(collection(db, "profiles"), (s) => { s.forEach((d) => (profiles[d.id] = d.data())); renderMsgs(); }, () => {}));
  unsubs.push(onSnapshot(query(collection(db, "groupMembers"), where("groupId", "==", GROUP_ID)), (s) => {
    members = s.docs.map((d) => d.data()).filter((m) => m.status === "active"); updateHead();
  }, () => {}));

  const headSub = h("span", { class: "muted small" });
  const avatar = g.photoURL ? h("img", { class: "avatar", src: g.photoURL, alt: "" }) : h("div", { class: "avatar" }, "S");
  function updateHead() { const on = members.filter((m) => online[m.uid]).length; headSub.textContent = `${members.length} anggota · ${on} online`; }
  const head = h("div", { class: "chat-head" }, avatar,
    h("div", { class: "title", onclick: openMembers }, h("b", {}, g.name || "Grup Sela"), headSub),
    h("button", { class: "icon-btn", "aria-label": "Panggilan suara", onclick: () => pickPeer(false) }, "📞"),
    h("button", { class: "icon-btn", "aria-label": "Video call", onclick: () => pickPeer(true) }, "🎥"),
    h("button", { class: "icon-btn", "aria-label": "Tema", onclick: toggleTheme }, "🌓"),
    h("button", { class: "icon-btn", "aria-label": "Keluar", onclick: () => signOutNow() }, "⎋"));

  const list = h("div", { class: "msgs" });
  const replyBar = h("div", { class: "replybar hidden" });
  const input = h("textarea", { rows: "1", placeholder: "Tulis pesan…", "aria-label": "Pesan" });
  const fileInput = h("input", { type: "file", accept: "image/*", class: "hidden" });
  const sendBtn = h("button", { class: "send", "aria-label": "Kirim" }, "➤");
  const composer = h("div", { class: "composer" },
    h("button", { class: "icon-btn", onclick: openEmoji, "aria-label": "Emoji" }, "😊"),
    h("button", { class: "icon-btn", onclick: () => fileInput.click(), "aria-label": "Lampirkan" }, "📎"),
    input, sendBtn, fileInput);

  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 110) + "px"; });
  sendBtn.onclick = sendText;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)) { e.preventDefault(); sendText(); } });
  fileInput.onchange = () => { const f = fileInput.files[0]; fileInput.value = ""; if (f) previewMedia(f); };

  function setReply(m) {
    replyTo = m ? { id: m.id, text: m.text || (m.messageType === "image" ? "📷 Foto" : "🎥 Video"), name: nameOf(m.senderUid) } : null;
    replyBar.classList.toggle("hidden", !replyTo);
    replyBar.replaceChildren(h("div", { class: "grow" }, "Membalas ", h("b", {}, replyTo?.name || ""), ": ", (replyTo?.text || "").slice(0, 60)), h("button", { class: "icon-btn", onclick: () => setReply(null) }, "✕"));
    if (m) input.focus();
  }

  async function sendText() {
    const text = input.value.trim(); if (!text) return;
    input.value = ""; input.style.height = "auto";
    const rt = replyTo; setReply(null);
    try { await addDoc(collection(db, "messages"), base("text", text, null, rt)); }
    catch (e) { input.value = text; toast("Pesan gagal terkirim: " + friendlyError(e), "err"); }
  }
  function base(type, text, imageData, rt) {
    return { groupId: GROUP_ID, senderUid: uid, messageType: type, text: text || "", imageData: imageData || null, createdAt: serverTimestamp(), replyTo: rt || null, reactions: {}, readBy: {} };
  }

  async function previewMedia(file) {
    if (!file.type.startsWith("image/")) return toast("Hanya foto yang didukung. Video dimatikan karena tanpa Storage.", "err");
    let dataUrl;
    try { dataUrl = await compressImage(file, 800, 0.6, 220000); } catch (e) { return toast(e.message || "Foto tidak dapat diproses.", "err"); }
    const err = h("div", { class: "error" });
    const cap = h("input", { class: "input", placeholder: "Tambah keterangan (opsional)", maxlength: "500" });
    const send = h("button", { class: "btn primary" }, "Kirim");
    const close = openSheet("Pratinjau", h("div", { class: "stack" },
      h("img", { src: dataUrl, style: "max-width:100%;border-radius:12px" }), cap, err, send));
    send.onclick = async () => {
      send.disabled = true; send.textContent = "Mengirim…"; err.textContent = "";
      try {
        const rt = replyTo; setReply(null);
        await addDoc(collection(db, "messages"), base("image", cap.value.trim(), dataUrl, rt));
        close();
      } catch (e) { err.textContent = "Gagal mengirim: " + friendlyError(e); send.disabled = false; send.textContent = "Coba lagi"; }
    };
  }

  function openEmoji() {
    const grid = h("div", { class: "emoji-grid" }, EMOJIS.map((e) => h("span", { onclick: () => { input.value += e; input.focus(); } }, e)));
    openSheet("Emoji", grid);
  }

  function ticks(m, pending) {
    if (pending) return "🕓";
    const read = Object.keys(m.readBy || {}).some((k) => k !== m.senderUid);
    return h("span", { class: "ticks" + (read ? " read" : "") }, read ? "✓✓" : "✓");
  }

  function msgNode(m) {
    const me = m.senderUid === uid;
    const b = h("div", { class: "bubble" });
    if (m.replyTo) b.append(h("div", { class: "quote" }, h("b", {}, m.replyTo.name), ": ", String(m.replyTo.text || "").slice(0, 80)));
    if (m.imageData) b.append(h("img", { src: m.imageData, loading: "lazy", alt: "Foto" }));
    if (m.text) b.append(h("div", {}, m.text));
    b.append(h("div", { class: "meta" }, fmtTime(m.createdAt) || "…", " ", me ? ticks(m, m._pending) : ""));
    const counts = {};
    Object.values(m.reactions || {}).forEach((e) => (counts[e] = (counts[e] || 0) + 1));
    const reacts = Object.keys(counts).length ? h("div", { class: "reacts" }, Object.entries(counts).map(([e, n]) => h("span", { class: "react" }, e + " " + n))) : null;
    return h("div", { class: "msg" + (me ? " me" : "") },
      me ? null : h("div", { class: "who", onclick: () => openProfile(m.senderUid) }, nameOf(m.senderUid)),
      b, reacts, h("button", { class: "msg-actions", onclick: () => msgMenu(m) }, "⋯ Opsi"));
  }

  function msgMenu(m) {
    let close;
    const row = (t, fn, cls = "ghost") => h("button", { class: "btn " + cls, onclick: () => { close(); fn(); } }, t);
    close = openSheet("Pesan", h("div", { class: "stack" },
      h("div", { class: "row wrap" }, REACTS.map((e) => h("button", { class: "icon-btn", onclick: () => { close(); react(m, e); } }, e))),
      row("↩ Balas", () => setReply(m)),
      m.senderUid !== uid ? row("🚩 Laporkan pesan", () => report(m), "danger") : row("🗑 Hapus pesan saya", async () => { try { await deleteDoc(doc(db, "messages", m.id)); } catch (e) { toast(friendlyError(e), "err"); } }, "danger")));
  }
  async function react(m, e) {
    const mine = m.reactions?.[uid];
    try { await updateDoc(doc(db, "messages", m.id), { ["reactions." + uid]: mine === e ? deleteField() : e }); } catch (er) { toast(friendlyError(er), "err"); }
  }
  function report(m) {
    const reason = h("textarea", { class: "input", rows: "3", maxlength: "500", placeholder: "Alasan laporan (mis. pelecehan, spam)" });
    const err = h("div", { class: "error" }); const btn = h("button", { class: "btn danger" }, "Kirim laporan");
    const close = openSheet("Laporkan pesan", h("div", { class: "stack" }, h("p", { class: "muted" }, "Admin akan meninjau pesan ini sesuai kebijakan grup."), reason, btn, err));
    btn.onclick = async () => {
      if (reason.value.trim().length < 3) { err.textContent = "Tuliskan alasan."; return; }
      btn.disabled = true;
      try {
        await addDoc(collection(db, "reports"), { reporterUid: uid, messageId: m.id, reason: reason.value.trim(), status: "open", createdAt: serverTimestamp(),
          snapshot: { text: m.text || "", messageType: m.messageType, senderUid: m.senderUid, senderName: nameOf(m.senderUid) } });
        close(); toast("Laporan terkirim ke admin.", "good");
      } catch (e) { err.textContent = friendlyError(e); btn.disabled = false; }
    };
  }

  function memberRow(m, onClick) {
    const on = !!online[m.uid];
    return h("div", { class: "list-item", onclick: onClick },
      h("div", { class: "avatar" }, initial(m.uid), h("span", { class: "dot" + (on ? " on" : "") })),
      h("div", { class: "grow" }, h("b", {}, nameOf(m.uid) + (m.uid === uid ? " (kamu)" : "")), h("div", { class: "muted small" }, (m.role === "admin" ? "Admin · " : "") + (on ? "online" : "offline"))));
  }
  function openMembers() { openSheet("Anggota (" + members.length + ")", h("div", {}, members.map((m) => memberRow(m, () => openProfile(m.uid))))); }
  function openProfile(id) {
    const m = members.find((x) => x.uid === id); const on = !!online[id];
    openSheet("Profil", h("div", { class: "stack", style: "text-align:center" },
      h("div", { class: "avatar", style: "width:80px;height:80px;font-size:2rem;margin:auto" }, initial(id)),
      h("h2", {}, nameOf(id)), h("p", { class: "muted" }, (on ? "🟢 online" : "⚪ offline") + (m ? " · bergabung " + fmtDateTime(m.joinedAt) : "")),
      id !== uid ? h("div", { class: "row" },
        h("button", { class: "btn ghost grow", onclick: () => call.startCall(id, false) }, "📞 Suara"),
        h("button", { class: "btn primary grow", onclick: () => call.startCall(id, true) }, "🎥 Video")) : null));
  }
  function pickPeer(video) {
    const others = members.filter((m) => m.uid !== uid);
    let close;
    close = openSheet(video ? "Video call ke…" : "Telepon ke…", others.length ? h("div", {}, others.map((m) => memberRow(m, () => { close(); call.startCall(m.uid, video); }))) : h("p", { class: "muted" }, "Belum ada anggota lain."));
  }

  function renderMsgs() {
    const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 140;
    list.replaceChildren(...lastDocs.map(msgNode));
    if (nearBottom || firstLoad) list.scrollTop = list.scrollHeight;
  }

  // Pesan real-time (100 terbaru)
  unsubs.push(onSnapshot(query(collection(db, "messages"), where("groupId", "==", GROUP_ID), orderBy("createdAt", "desc"), limit(40)), { includeMetadataChanges: true }, (snap) => {
    lastDocs = snap.docs.map((d) => ({ id: d.id, ...d.data(), _pending: d.metadata.hasPendingWrites })).reverse();
    if (!firstLoad) snap.docChanges().forEach((c) => {
      const d = c.doc.data();
      if (c.type === "added" && d.senderUid !== uid && !c.doc.metadata.hasPendingWrites) {
        const body = d.text || (d.messageType === "image" ? "📷 Foto" : "🎥 Video");
        if (document.hidden) { try { if (Notification.permission === "granted") new Notification(nameOf(d.senderUid), { body }); } catch {} }
        else toast(nameOf(d.senderUid) + ": " + body.slice(0, 60));
      }
    });
    renderMsgs(); firstLoad = false;
    if (!document.hidden) lastDocs.forEach((m) => { if (m.senderUid !== uid && !m._pending && !(m.readBy || {})[uid]) updateDoc(doc(db, "messages", m.id), { ["readBy." + uid]: true }).catch(() => {}); });
  }, (e) => toast("Pesan gagal dimuat: " + friendlyError(e), "err")));

  if ("Notification" in window && Notification.permission === "default") setTimeout(() => Notification.requestPermission().catch(() => {}), 4000);

  return {
    node: h("div", { class: "chat" }, head, list, replyBar, composer),
    cleanup: () => { unsubs.forEach((f) => { try { f(); } catch {} }); call.destroy(); },
  };
}

</script></body></html>
