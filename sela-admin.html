  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);

  for (const c of kids.flat(Infinity)) {

/* ---- Tombol kembali Android: menutup lapisan teratas (sheet, penampil, penyunting) sebelum keluar aplikasi ---- */
const bk = { stack: [], hist: 0, pending: false, armed: false };
function backSync() {
  if (bk.pending) return;
  while (bk.hist < bk.stack.length) { history.pushState({ sela: "o" }, ""); bk.hist++; }
  if (bk.hist > bk.stack.length) { bk.pending = true; history.back(); }
}
function backPush(closeFn) {
  const e = { closeFn }; bk.stack.push(e); backSync();
  return () => { const i = bk.stack.indexOf(e); if (i >= 0) { bk.stack.splice(i, 1); backSync(); } };
}
try { history.replaceState({ sela: "base" }, ""); history.pushState({ sela: "root" }, ""); } catch {}
window.addEventListener("popstate", () => {
  if (bk.pending) { bk.pending = false; bk.hist = Math.max(0, bk.hist - 1); backSync(); return; }
  if (bk.hist > 0) { bk.hist--; const e = bk.stack.pop(); try { e?.closeFn(); } catch {} backSync(); return; }
  // Di layar utama: cegah keluar tak sengaja.
  if (document.querySelector(".call")) { toast("Akhiri panggilan dulu dengan tombol Akhiri."); history.pushState({ sela: "root" }, ""); return; }
  if (bk.armed) { bk.armed = false; history.back(); return; }
  bk.armed = true; toast("Tekan kembali sekali lagi untuk keluar"); history.pushState({ sela: "root" }, ""); setTimeout(() => { bk.armed = false; }, 2200);
});

async function compressImage(file, maxDim = 800, q = 0.6, maxChars = 220000) {
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) throw new Error("Foto tidak dapat dibaca.");
  const sc = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  for (let qq = q; qq >= 0.29; qq -= 0.1) { const d = c.toDataURL("image/jpeg", qq); if (d.length <= maxChars) return d; }

/*
 * Penyimpanan foto/video di Storj (S3). Penandatanganan SigV4 dilakukan di browser.
 *  - uploadMedia: memakai kunci TULIS (hanya Write ke bucket sela-media).
 *  - loadMedia  : memakai kunci BACA (hanya Read). Nama file acak panjang dan tidak bisa didaftar.
 *  - deleteMedia: memakai kunci ADMIN yang ditempel sendiri oleh admin (tidak ada di kode).
 */
const sjEnc = new TextEncoder();
const sjHex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
const sjSha = async (d) => sjHex(await crypto.subtle.digest("SHA-256", d instanceof ArrayBuffer ? d : sjEnc.encode(d)));
async function sjHmac(key, msg) {
  const k = await crypto.subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", k, sjEnc.encode(msg)));
}
async function sjFetch(method, key, creds, body, contentType) {
  const host = new URL(STORJ.endpoint).host;
  const amz = new Date().toISOString().replace(/[:-]|\.\d{3}/g, "");
  const date = amz.slice(0, 8);
  const buf = body ? await body.arrayBuffer() : null;
  const payload = await sjSha(buf || "");
  const path = "/" + STORJ.bucket + "/" + key;
  const hd = { "x-amz-content-sha256": payload, "x-amz-date": amz };
  let canonH = "", names = [];
  if (contentType) { hd["Content-Type"] = contentType; canonH += `content-type:${contentType}\n`; names.push("content-type"); }
  canonH += `host:${host}\nx-amz-content-sha256:${payload}\nx-amz-date:${amz}\n`; names.push("host", "x-amz-content-sha256", "x-amz-date");
  const canon = [method, path, "", canonH, names.join(";"), payload].join("\n");
  const scope = `${date}/${STORJ.region}/s3/aws4_request`;
  const sts = ["AWS4-HMAC-SHA256", amz, scope, await sjSha(canon)].join("\n");
  let k = await sjHmac(sjEnc.encode("AWS4" + creds.sk), date);
  k = await sjHmac(k, STORJ.region); k = await sjHmac(k, "s3"); k = await sjHmac(k, "aws4_request");
  hd.Authorization = `AWS4-HMAC-SHA256 Credential=${creds.ak}/${scope}, SignedHeaders=${names.join(";")}, Signature=${sjHex(await sjHmac(k, sts))}`;
  return fetch(STORJ.endpoint + path, { method, headers: hd, body: buf || undefined });
}

const SJ_EXT = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "video/webm": "webm", "video/mp4": "mp4", "video/quicktime": "mov" };
async function uploadMedia(blob, mime) {
  const mt = (mime || blob.type || "application/octet-stream").split(";")[0];
  const ext = SJ_EXT[mt] || "bin";
  const rnd = crypto.getRandomValues(new Uint8Array(12));
  const key = "m/" + sjHex(rnd) + "." + ext;
  const r = await sjFetch("PUT", key, STORJ.write, blob, mt);
  if (!r.ok) throw new Error("Unggah ke penyimpanan gagal (" + r.status + ").");
  return { key, mime: mt, size: blob.size };
}

const sjCache = new Map();
function loadMedia(key, mime) {
  if (!sjCache.has(key)) {
    sjCache.set(key, (async () => {
      const r = await sjFetch("GET", key, STORJ.read);
      if (!r.ok) throw new Error("Gagal memuat media (" + r.status + ").");
      const b = await r.blob();
      return URL.createObjectURL(mime ? new Blob([b], { type: mime }) : b);
    })().catch((e) => { sjCache.delete(key); throw e; }));
  }
  return sjCache.get(key);
}

function sjAdminKey() {
  try { const s = JSON.parse(localStorage.getItem("sela-storj-admin") || "null"); if (s?.ak && s?.sk) return s; } catch {}
  const ak = (prompt("Tempel Access Key ADMIN Storj (hanya admin, tersimpan di HP ini):") || "").trim();
  const sk = ak ? (prompt("Tempel Secret Key ADMIN Storj:") || "").trim() : "";
  if (!ak || !sk) return null;
  try { localStorage.setItem("sela-storj-admin", JSON.stringify({ ak, sk })); } catch {}
  return { ak, sk };
}
function forgetAdminKey() { try { localStorage.removeItem("sela-storj-admin"); } catch {} }
async function deleteMedia(key) {
  const c = sjAdminKey(); if (!c) throw new Error("Kunci admin Storj belum diisi.");
  const r = await sjFetch("DELETE", key, c);
  if (!r.ok && r.status !== 404) { if (r.status === 403) forgetAdminKey(); throw new Error("Hapus file gagal (" + r.status + ")."); }
}

// Elemen tampilan media untuk satu pesan (data lama di Firestore maupun file di Storj).
// Foto dan video langsung tampil (dimuat saat mendekati layar). Elemen di-cache supaya video tidak berhenti saat daftar pesan digambar ulang.
const sjEls = new Map();
function sjLazy(el, fn) {
  if (!("IntersectionObserver" in window)) { fn(); return; }
  const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { io.disconnect(); fn(); } }, { rootMargin: "400px" });
  io.observe(el);
}
function mediaEl(m, o = {}) {
  const open = o.onOpen;
  if (m.imageData) return h("img", { src: m.imageData, loading: "lazy", alt: "Foto", onclick: open });
  if (m.videoData) return h("video", { src: m.videoData, controls: !o.tile, muted: !!o.tile, preload: "metadata", playsinline: true, onclick: o.tile ? open : null });
  if (!m.mediaKey) return null;
  const ck = o.auto ? null : m.mediaKey + (o.tile ? "|t" : "|f");
  if (ck && sjEls.has(ck)) return sjEls.get(ck);
  const el = sjBuild(m, o, ck);
  if (el) sjLock(el);
  if (ck && el) sjEls.set(ck, el);
  return el;
}
// Mempersulit simpan lewat browser (tekan lama, seret, menu unduh). Ini bukan pemblokir screenshot.
function sjLock(el) {
  const apply = (n) => { if (!(n instanceof Element)) return; n.setAttribute("draggable", "false"); n.addEventListener("contextmenu", (e) => e.preventDefault()); if (n.tagName === "VIDEO") { n.setAttribute("controlsList", "nodownload noremoteplayback"); n.setAttribute("disablePictureInPicture", ""); } };
  apply(el);
  new MutationObserver((ms) => ms.forEach((mu) => mu.addedNodes.forEach((n) => { apply(n); n.querySelectorAll?.("img,video").forEach(apply); }))).observe(el, { childList: true });
}
function sjBuild(m, o, ck) {
  const open = o.onOpen;
  const isVid = m.messageType === "video" || String(m.mime || "").startsWith("video/");
  if (!isVid) {
    const im = h("img", { alt: "Foto", onclick: open });
    loadMedia(m.mediaKey, m.mime).then((u) => { im.src = u; }).catch(() => { if (ck) sjEls.delete(ck); im.replaceWith(h("div", { class: "muted small" }, "⚠ Foto gagal dimuat")); });
    return im;
  }
  const mb = m.size ? " (" + (m.size / 1048576).toFixed(1) + " MB)" : "";
  if (o.tile) {
    const t = h("div", { class: "vtile", onclick: open }, h("span", { class: "vplay" }, "▶"));
    sjLazy(t, async () => {
      try { const u = await loadMedia(m.mediaKey, m.mime); const v = h("video", { src: u, muted: true, preload: "metadata", playsinline: true }); v.muted = true; v.addEventListener("loadedmetadata", () => { try { v.currentTime = 0.1; } catch {} }); t.prepend(v); }
      catch { t.append(h("span", { class: "muted small" }, "⚠")); }
    });
    return t;
  }
  const holder = h("div", { class: "vwrap" }, h("div", { class: "muted small" }, "Memuat video" + mb + "…"));
  const load = async () => {
    holder.replaceChildren(h("div", { class: "muted small" }, "Memuat video" + mb + "…"));
    try {
      const u = await loadMedia(m.mediaKey, m.mime);
      const v = h("video", { src: u, controls: true, playsinline: true, preload: "metadata", style: "width:100%;border-radius:12px;max-height:340px;background:#000" });
      if (o.auto) v.autoplay = true; else v.addEventListener("loadedmetadata", () => { try { v.currentTime = 0.1; } catch {} }, { once: true });
      holder.replaceChildren(v);
    } catch { holder.replaceChildren(h("button", { class: "btn ghost small", onclick: load }, "⚠ Gagal memuat. Coba lagi")); }
  };
  if (o.auto) load(); else sjLazy(holder, load);
  return holder;
}

// ---- Simpan / lihat media ----
async function mediaURL(m) {
  if (m.imageData) return m.imageData;
  if (m.videoData) return m.videoData;
  if (m.mediaKey) return loadMedia(m.mediaKey, m.mime);
  throw new Error("Tidak ada media.");
}
function extOf(m, blob) {
  const t = String(m.mime || blob?.type || "");
  if (t.includes("png")) return "png"; if (t.includes("webp")) return "webp";
  if (t.startsWith("video/")) return t.includes("mp4") ? "mp4" : "webm";
  return "jpg";
}
async function saveMedia(m) {
  const u = await mediaURL(m);
  const blob = await (await fetch(u)).blob();
  const name = "sela-" + Date.now() + "." + extOf(m, blob);
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return name;
}
// Penampil layar penuh (seperti WhatsApp): tombol tutup, simpan, dan konten tambahan opsional.
function openViewer(m, o = {}) {

/*
 * Room panggilan grup (mesh WebRTC). 10 room, tiap room maksimal 10 peserta.
 *   rooms/{r1..r10}.members = { uid: { sid, video, ts } }   (ts diperbarui tiap 20 dtk sebagai penanda masih aktif)
 *   rooms/{rid}/sig/{pid} + /cand          signaling antar peserta (pid = penawar.sid.penjawab.sid)
 *   rooms/{rid}/observers/{adminUid}        admin bergabung sebagai pemantau (SELALU diumumkan ke peserta)
 *   rooms/{rid}/obsPeers/{uid_sid} + /cand  signaling admin <-> peserta
 * Mesh berarti tiap peserta mengirim ke semua peserta lain: pada 6+ orang matikan kamera agar lancar.
 */
const ROOM_COUNT = 10;
const ROOM_CAP = 10;
const ROOM_FRESH_MS = 75000;
const roomIds = Array.from({ length: ROOM_COUNT }, (_, i) => "r" + (i + 1));
function freshMembers(data, now = Date.now()) {
  return Object.entries(data?.members || {})
    .filter(([, v]) => (v?.ts?.toMillis ? now - v.ts.toMillis() < ROOM_FRESH_MS : true))
    .map(([uid, v]) => ({ uid, ...v }));
}

class RoomManager {
  constructor({ db, uid, nameOf, root }) {
    Object.assign(this, { db, uid, nameOf, root });
    this.rid = null; this.sid = null; this.local = null; this.ui = null; this.peers = new Map(); this.unsubs = [];
    this.obsPeers = {}; this.hb = null; this.seenSelf = false; this.facing = "user"; this.left = true;
    window.addEventListener("pagehide", () => { if (this.rid) this.leave(true); });
  }

  async join(rid, wantVideo = true) {
    if (this.rid) return toast("Kamu sedang berada di sebuah room.", "err");
    if (!navigator.mediaDevices?.getUserMedia) return toast("Browser tidak mendukung panggilan. Buka lewat https di Chrome.", "err");
    const ref = doc(this.db, "rooms", rid);
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
        video: wantVideo ? { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 15 } } : false,
      });
    } catch { return toast("Izin kamera/mikrofon ditolak. Aktifkan di pengaturan situs.", "err"); }
    const sid = Math.random().toString(36).slice(2, 10);
    let others = 0;
    try {
      await runTransaction(this.db, async (tx) => {
        const s = await tx.get(ref);
        const fresh = freshMembers(s.exists() ? s.data() : {}).filter((m) => m.uid !== this.uid);
        others = fresh.length;
        if (fresh.length >= ROOM_CAP) { const e = new Error("full"); e.full = true; throw e; }
        tx.set(ref, { members: { [this.uid]: { sid, video: !!wantVideo, ts: serverTimestamp() } } }, { merge: true });
      });
    } catch (e) {
      stream.getTracks().forEach((t) => t.stop());
      return toast(e.full ? "Room ini sudah penuh (10/10). Silakan pindah ke Room lain." :
        e.code === "permission-denied" ? "Room penuh atau berisi sesi lama. Pindah ke Room lain, atau minta admin mengosongkan room ini." :
        "Gagal masuk room: " + friendlyError(e), "err");
    }
    this.rid = rid; this.sid = sid; this.local = stream; this.left = false; this.seenSelf = false;
    // Banyak peserta: kamera dimatikan otomatis agar lancar (bisa dinyalakan lagi).
    if (others >= 5) stream.getVideoTracks().forEach((t) => (t.enabled = false));
    this.buildUI(rid);
    this.hb = setInterval(() => updateDoc(ref, { ["members." + this.uid + ".ts"]: serverTimestamp() }).catch(() => {}), 20000);
    this.unsubs.push(onSnapshot(ref, (snap) => {
      const data = snap.data() || {};
      const me = data.members?.[this.uid];
      if (me && me.sid === this.sid) this.seenSelf = true;
      else if (this.seenSelf) { toast("Kamu dikeluarkan dari room oleh admin.", "err"); this.leave(false); return; }
      this.sync(freshMembers(data));
    }, () => {}));
    this.watchObservers();
  }

  /* ---------- peserta lain ---------- */
  sync(members) {
    if (!this.rid) return;
    const others = members.filter((m) => m.uid !== this.uid);
    for (const [uid, p] of [...this.peers]) {
      const m = others.find((x) => x.uid === uid);
      if (!m || m.sid !== p.sid) this.drop(uid);
    }
    others.forEach((m) => { if (!this.peers.has(m.uid)) this.connect(m); });
    this.layout(members.length);
  }

  connect(m) {
    const offerer = this.uid < m.uid;
    const pid = (offerer ? [this.uid, this.sid, m.uid, m.sid] : [m.uid, m.sid, this.uid, this.sid]).join(".");
    const pref = doc(this.db, "rooms", this.rid, "sig", pid), cand = collection(pref, "cand");
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    const p = { pc, sid: m.sid, unsubs: [], tile: this.makeTile(m.uid) };
    this.peers.set(m.uid, p);
    this.local.getTracks().forEach((t) => pc.addTrack(t, this.local));
    pc.ontrack = (e) => { p.tile.video.srcObject = e.streams[0]; };
    pc.onicecandidate = (e) => { if (e.candidate) addDoc(cand, { from: offerer ? "o" : "a", ...e.candidate.toJSON() }).catch(() => {}); };
    pc.onconnectionstatechange = () => {
      p.tile.state.textContent = pc.connectionState === "connected" ? "" : pc.connectionState === "failed" ? "terputus" : "menyambung…";
      if (pc.connectionState === "connected") this.limitBitrate(pc);
      if (pc.connectionState === "failed") setTimeout(() => { if (this.peers.get(m.uid) === p) { this.drop(m.uid); this.layout(this.peers.size + 1); this.refreshRoster(); } }, 2000);
    };
    const pending = []; const want = offerer ? "a" : "o";
    const flush = () => pending.splice(0).forEach((x) => pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}));
    p.unsubs.push(onSnapshot(cand, (s) => s.docChanges().forEach((ch) => {
      if (ch.type !== "added") return;
      const { from, ...x } = ch.doc.data(); if (from !== want) return;
      if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}); else pending.push(x);
    }), () => {}));
    if (offerer) {
      (async () => {
        try {
          const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
          await setDoc(pref, { offer: { type: offer.type, sdp: offer.sdp }, answer: null });
        } catch {}
      })();
      p.unsubs.push(onSnapshot(pref, (s) => {
        const d = s.data();
        if (d?.answer && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(d.answer)).then(flush).catch(() => {});
      }, () => {}));
    } else {
      let handled = null;
      p.unsubs.push(onSnapshot(pref, async (s) => {
        const d = s.data();
        if (!d?.offer || d.answer || handled === d.offer.sdp) return;
        handled = d.offer.sdp;
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(d.offer)); flush();
          const a = await pc.createAnswer(); await pc.setLocalDescription(a);
          await updateDoc(pref, { answer: { type: a.type, sdp: a.sdp } });
        } catch {}
      }, () => {}));
    }
  }
  refreshRoster() { /* memicu sinkronisasi ulang lewat heartbeat sendiri */ if (this.rid) updateDoc(doc(this.db, "rooms", this.rid), { ["members." + this.uid + ".ts"]: serverTimestamp() }).catch(() => {}); }
  limitBitrate(pc) {
    try { pc.getSenders().forEach((s) => { if (s.track?.kind !== "video") return; const prm = s.getParameters(); prm.encodings = prm.encodings?.length ? prm.encodings : [{}]; prm.encodings[0].maxBitrate = 130000; s.setParameters(prm).catch(() => {}); }); } catch {}
  }
  drop(uid) {
    const p = this.peers.get(uid); if (!p) return;
    p.unsubs.forEach((f) => { try { f(); } catch {} }); try { p.pc.close(); } catch {}
    p.tile.el.remove(); this.peers.delete(uid);
  }

  /* ---------- UI ---------- */
  makeTile(uid, me = false) {
    const video = h("video", { autoplay: true, playsinline: true }); if (me) video.muted = true;
    const state = h("span", { class: "muted small" });
    const nm = me ? "Kamu" : this.nameOf(uid);
    const el = h("div", { class: "rtile " + (me ? "me" : "other") }, h("div", { class: "ph" }, (nm[0] || "?").toUpperCase()), video, h("div", { class: "nm" }, nm, " ", state));
    this.ui?.grid.append(el);
    return { el, video, state };
  }
  buildUI(rid) {
    this.closeUI();
    const grid = h("div", { class: "room-grid" });
    const title = h("b", {}, "Room " + rid.slice(1));
    const count = h("div", {}, "");
    const banner = h("div", { class: "banner hidden" });
    const chip = h("div", { class: "obs-chip hidden" }, "👁 Dipantau admin");
    const ctrls = h("div", { class: "ctrls" });
    const el = h("div", { class: "call room" }, grid, h("div", { class: "top" }, title, count, banner, chip), ctrls);
    this.root.append(el);
    this.ui = { el, grid, count, banner, chip, ctrls };
    this.me = this.makeTile(this.uid, true); this.me.video.srcObject = this.local; applyMirror(this.me.video, this.facing);
    const mic = h("button", { class: "cbtn", "aria-label": "Mikrofon" }, "🎤");
    const cam = h("button", { class: "cbtn", "aria-label": "Kamera" }, "📷");
    const flip = h("button", { class: "cbtn", "aria-label": "Balik kamera" }, "🔄");
    const end = h("button", { class: "cbtn end", "aria-label": "Keluar room" }, "📵");
    const vt = () => this.local.getVideoTracks()[0];
    const paintCam = () => cam.classList.toggle("off", !!vt() && !vt().enabled);
    paintCam();
    mic.onclick = () => { const t = this.local.getAudioTracks()[0]; if (!t) return; t.enabled = !t.enabled; mic.classList.toggle("off", !t.enabled); mic.textContent = t.enabled ? "🎤" : "🔇"; };
    cam.onclick = () => { const t = vt(); if (!t) return toast("Kamu masuk tanpa kamera.", "err"); t.enabled = !t.enabled; paintCam(); };
    const mir = h("button", { class: "cbtn", "aria-label": "Cermin" }, "🪞");
    mir.onclick = () => { setMirror(!mirrorOn()); applyMirror(this.me.video, this.facing); };
    flip.onclick = () => this.flipCamera();
    end.onclick = () => this.leave(false);
    ctrls.replaceChildren(mic, cam, flip, mir, end);
    this.layout(1);
  }
  layout(n) {
    if (!this.ui) return;
    const g = this.ui.grid; const others = this.peers.size;
    g.classList.toggle("duo", others === 1);
    g.style.setProperty("--cols", String(n <= 4 ? 2 : 3));
    g.style.setProperty("--rows", String(Math.ceil(n / (n <= 4 ? 2 : 3))));
    if (others === 0) g.classList.add("solo"); else g.classList.remove("solo");
    this.ui.count.textContent = `${n}/${ROOM_CAP} peserta` + (n > 5 ? " · matikan kamera agar lancar" : "");
  }
  closeUI() { this.ui?.el.remove(); this.ui = null; }
  setChip(on) { const c = this.ui?.chip; if (c) c.classList.toggle("hidden", !on); }
  setBanner(t, ms) {
    const b = this.ui?.banner; if (!b) return;
    b.textContent = t || ""; b.classList.toggle("hidden", !t);
    if (ms) setTimeout(() => { if (b.textContent === t) { b.textContent = ""; b.classList.add("hidden"); } }, ms);
  }
  async flipCamera() {
    try {
      const next = this.facing === "user" ? "environment" : "user";
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: next }, width: { ideal: 320 }, height: { ideal: 240 } } });
      const nt = s.getVideoTracks()[0];
      const was = this.local.getVideoTracks()[0]; if (was) nt.enabled = was.enabled;

  /* ---------- pemantau admin (selalu diumumkan) ---------- */
  watchObservers() {

  }

      if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}); else pending.push(x);
    }), () => {}));
  }
  closeAdmin(aid) {

    r.unsubs.forEach((f) => { try { f(); } catch {} }); try { r.pc.close(); } catch {}

  }

  async leave(quiet) {

  }
}

    unsubs.push(onSnapshot(cand, (s) => s.docChanges().forEach((ch) => {
      if (ch.type !== "added") return;
      const { from, ...x } = ch.doc.data(); if (from !== "member") return;
      if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}); else pending.push(x);
    })));
    return { sid: m.sid, close: () => { unsubs.forEach((f) => { try { f(); } catch {} }); try { pc.close(); } catch {} tile.remove(); } };
  }
  function stopRoomObserve() {
    if (!robs.rid) return; const id = robs.rid; robs.rid = null;
    robs.unsubs.splice(0).forEach((f) => { try { f(); } catch {} });
    robs.items.forEach((it) => it.close()); robs.items.clear();
    robs.el?.remove(); robs.el = null;
    deleteDoc(doc(db, "rooms", id, "observers", aid)).catch(() => {});
  }
  const obs = { callId: null, pcs: [], unsubs: [], el: null };
  async function observe(c) {
    if (obs.callId) return toast("Anda sudah memantau satu panggilan.", "err");
    obs.callId = c.id;
    const grid = h("div", { class: "obs-grid" });
    const leave = h("button", { class: "btn ghost" }, "Keluar");
    const cut = h("button", { class: "btn danger" }, "⛔ Putuskan panggilan");
    cut.onclick = async () => { await endCall(c); };
    obs.el = h("div", { class: "call" }, h("div", { class: "top" }, h("b", {}, "👁 Memantau (tanpa kamera & mikrofon)"), h("div", {}, nameOf(c.callerUid) + " ↔ " + nameOf(c.receiverUid) + " · peserta diberi tahu")), grid, h("div", { class: "ctrls" }, leave, cut));
    document.body.append(obs.el);
    leave.onclick = stopObserve;
    try {
      await setDoc(doc(db, "calls", c.id, "observers", aid), { adminUid: aid, joinedAt: serverTimestamp() });
      audit("observe_call", c.id, { caller: c.callerUid, receiver: c.receiverUid });
      obs.unsubs.push(onSnapshot(doc(db, "calls", c.id), (s) => { if (s.data()?.status !== "accepted") { toast("Panggilan berakhir."); stopObserve(); } }));
      for (const peer of [c.callerUid, c.receiverUid]) await attachPeer(c, peer, grid);
    } catch (e) { fail(e); stopObserve(); }
  }
  async function attachPeer(c, peer, grid) {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS }); obs.pcs.push(pc);
    pc.addTransceiver("audio", { direction: "recvonly" });
    if (c.video) pc.addTransceiver("video", { direction: "recvonly" });
    const v = h("video", { autoplay: true, playsinline: true });
    grid.append(h("div", { class: "obs-tile", onclick: () => enlargeVideo(v, nameOf(peer)) }, v, h("div", { class: "small", style: "text-align:center" }, nameOf(peer) + " · ketuk untuk memperbesar")));
    pc.ontrack = (e) => { v.srcObject = e.streams[0]; };
    const pref = doc(db, "calls", c.id, "obsPeers", peer), cand = collection(pref, "cand");
    pc.onicecandidate = (e) => { if (e.candidate) addDoc(cand, { from: "admin", ...e.candidate.toJSON() }).catch(() => {}); };
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    await setDoc(pref, { offer: { type: offer.type, sdp: offer.sdp }, answer: null });
    const pending = [];
    obs.unsubs.push(onSnapshot(pref, (s) => {
      const d = s.data();
      if (d?.answer && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(d.answer)).then(() => pending.splice(0).forEach((x) => pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}))).catch(() => {});
    }));
    obs.unsubs.push(onSnapshot(cand, (s) => s.docChanges().forEach((ch) => {
      if (ch.type !== "added") return;
      const { from, ...x } = ch.doc.data(); if (from !== "member") return;
      if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}); else pending.push(x);
    })));
  }
  function stopObserve() {
    if (!obs.callId) return; const id = obs.callId; obs.callId = null;
    obs.unsubs.splice(0).forEach((f) => { try { f(); } catch {} });
    obs.pcs.splice(0).forEach((p) => { try { p.close(); } catch {} });
    obs.el?.remove(); obs.el = null;
    deleteDoc(doc(db, "calls", id, "observers", aid)).catch(() => {});
  }

  function media() {
    const items = D.messages.filter((m) => m.imageData || m.videoData || m.mediaKey);
    return [h("p", { class: "muted small" }, "Foto dan video yang dikirim ke grup (60 pesan terbaru). Hapus yang melanggar aturan atau keluarkan pengirimnya."),
      items.length ? h("div", { class: "gallery" }, items.map((m) => mediaEl(m, { tile: true, onOpen: () => mediaDetail(m) }))) : h("p", { class: "muted" }, "Belum ada foto atau video.")];
  }
  function mediaDetail(m) {
    let close = () => {};
    const del = h("button", { class: "btn danger" }, "🗑 Hapus media ini");
    del.onclick = async () => {
      if (!confirm("Hapus pesan ini dari grup?")) return; del.disabled = true;
      if (await removeMsg(m, "moderasi media")) close(); else del.disabled = false;
    };
    const kick = h("button", { class: "btn ghost", onclick: () => { close(); const mem = D.members.find((x) => x.uid === m.senderUid); if (mem) setMemberStatus(mem, "removed", "Keluarkan"); else toast("Pengirim bukan anggota aktif", "err"); } }, "Keluarkan pengirim dari grup");
    close = openViewer(m, { title: nameOf(m.senderUid), sub: fmtDateTime(m.createdAt), extra: h("div", { class: "stack" }, del, kick) });
  }

  function notif() {
    return [h("p", { class: "muted small" }, "Notifikasi dalam aplikasi (real-time selama panel terbuka). Push notification memerlukan konfigurasi FCM — lihat README."),
      notes.length ? notes.map((n) => h("div", { class: "card" }, h("div", {}, n.text), h("div", { class: "muted small" }, n.at.toLocaleTimeString("id-ID")))) : h("p", { class: "muted" }, "Belum ada notifikasi baru sejak panel dibuka.")];
  }

  function settings() {
    const g = D.group || {};
    const f = (label, el) => h("div", { class: "stack" }, h("label", {}, label), el);
    const name = h("input", { class: "input", value: g.name || "", maxlength: "60" });
    const desc = h("textarea", { class: "input", rows: "2", maxlength: "300" }, g.description || "");
    const welcome = h("textarea", { class: "input", rows: "2", maxlength: "300" }, g.welcomeMessage || "");
    const max = h("input", { class: "input", type: "number", min: "3", max: "60", value: g.maxRecordSeconds || 15 });
    const rules = h("textarea", { class: "input", rows: "5", maxlength: "4000" }, g.rulesText || "");
    const privacy = h("textarea", { class: "input", rows: "5", maxlength: "4000" }, g.privacyText || "");
    const photo = h("input", { type: "file", accept: "image/*" }), audio = h("input", { type: "file", accept: "audio/*" });
    const prog = h("progress", { class: "hidden", max: "100", value: "0" }); const err = h("div", { class: "error" });
    const save = h("button", { class: "btn primary" }, "Simpan pengaturan");
    save.onclick = async () => {
      err.textContent = ""; save.disabled = true; save.textContent = "Menyimpan…";
      try {
        const data = { name: name.value.trim() || "Grup Sela", description: desc.value.trim(), welcomeMessage: welcome.value.trim(), maxRecordSeconds: Math.min(60, Math.max(3, Number(max.value) || 15)), rulesText: rules.value, privacyText: privacy.value, updatedAt: serverTimestamp() };
        if (photo.files[0]) data.photoURL = await compressImage(photo.files[0], 256, 0.7, 120000);
        if (audio.files[0]) {
          const f = audio.files[0];
          if (f.size > 600000) throw new Error("Audio maksimal 600 KB (sekitar 40 detik MP3/Opus).");
          const du = await blobToDataURL(f);
          if (du.length > 800000) throw new Error("Audio terlalu besar.");
          await setDoc(doc(db, "groupAssets", "instruction"), { data: du, mime: f.type, updatedAt: serverTimestamp() });
          data.hasInstructionAudio = true;
        }
        await setDoc(doc(db, "groups", GROUP_ID), data, { merge: true });
        audit("update_group", GROUP_ID); toast("Pengaturan tersimpan ✓", "good");
      } catch (e) { err.textContent = "Gagal menyimpan: " + friendlyError(e); }
      finally { save.disabled = false; save.textContent = "Simpan pengaturan"; }
    };
    return [h("div", { class: "card stack" }, f("Nama grup", name), f("Deskripsi", desc), f("Pesan sambutan", welcome), f("Durasi maksimum rekaman (detik)", max),
      f("Foto grup", photo), f("Ganti audio instruksi verifikasi" + (g.hasInstructionAudio ? " (sudah ada)" : "") + " maks. 600 KB", audio),
      f("Aturan grup", rules), f("Kebijakan privasi", privacy), prog, save, err)];
  }

  function render() {
    if (!["users", "reqs", "members"].every((k) => loaded[k])) { content.replaceChildren(h("div", { class: "spinner", style: "margin:40px auto" })); drawNav(); return; }
    const active = document.activeElement;
    if (tab === "settings" && active && ["INPUT", "TEXTAREA"].includes(active.tagName) && content.contains(active)) return; // jangan hapus ketikan admin
    const fn = { dash, reqs, members, monitor, rooms: roomsTab, chat, media, notif, settings }[tab];
    content.replaceChildren(...[fn()].flat(Infinity)); drawNav();
  }
  render();
}

</script></body></html>
